name: E17 source upper affine algebra (focused Lean)

on:
  push:
    branches: ['research/e17-upper-scalar-algebra']
    paths:
      - 'lean/TenthDiscriminant/E17UpperAlgebra.lean'
      - '.github/workflows/e17-upper-algebra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e17-upper-algebra
  cancel-in-progress: true

jobs:
  e17-upper:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual Ender upper algebra with explicit guards
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E17UpperAlgebra 2>&1 | tee /tmp/e17-upper.log
          if grep -q 'sorryAx' /tmp/e17-upper.log; then exit 1; fi
      - name: Exact theorem and axioms
        run: |
          cat >/tmp/e17-axioms.lean <<'LEAN'
          import TenthDiscriminant.E17UpperAlgebra
          #check TenthDiscriminant.E17.enderUpperB_affine_from_guards
          #print axioms TenthDiscriminant.E17.enderUpperB_expanded
          #print axioms TenthDiscriminant.E17.enderUpperB_affine_from_guards
          LEAN
          set -o pipefail
          lake env lean /tmp/e17-axioms.lean | tee /tmp/e17-axioms.log
          if grep -q 'sorryAx' /tmp/e17-axioms.log; then exit 1; fi
