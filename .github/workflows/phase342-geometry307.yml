name: Phase342 307 original-source geometry and radius guard

on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase342Geometry307.lean'
      - '.github/workflows/phase342-geometry307.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase342Geometry307.lean'
      - '.github/workflows/phase342-geometry307.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase342-geometry307-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Independent exact 307 endpoint and false-guard controls
        working-directory: .
        run: python3 -m unittest discover -s research/phase341 -p 'test_*.py' -v
      - name: Build unchanged original ellipse 307 geometry
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase342Geometry307 2>&1 | tee /tmp/phase342-build.log
          if grep -q 'sorryAx' /tmp/phase342-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Inspect exact 307 theorem types and axioms
        run: |
          cat > /tmp/phase342-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase342Geometry307
          #check TenthDiscriminant.FirstCertificate.Tuned.R_ge_seventysix_cubes_307
          #check TenthDiscriminant.FirstCertificate.Tuned.radius_over_R_307
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_chosen_radius_307
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_radius_interpolation_count_307
          #check TenthDiscriminant.FirstCertificate.Tuned.old_seventyeight_cube_guard_fails_at_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.R_ge_seventysix_cubes_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.radius_over_R_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_chosen_radius_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_radius_interpolation_count_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.old_seventyeight_cube_guard_fails_at_307
          LEAN
          set -o pipefail
          lake env lean /tmp/phase342-axioms.lean | tee /tmp/phase342-axioms.log
          if grep -q 'sorryAx' /tmp/phase342-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
