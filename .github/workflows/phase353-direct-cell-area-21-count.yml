name: Phase353 direct original thin cell-area uniform cardinality
on:
  push:
    branches: ['research/phase353-direct-cell-area-21-count']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase353-original-count-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual source geometric cardinality
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase353DirectCellAreaCount 2>&1 | tee /tmp/phase353-build.log
          if grep -q 'sorryAx' /tmp/phase353-build.log; then exit 1; fi
      - name: Verify axioms on exact new theorem
        run: |
          cat >/tmp/phase353-audit.lean <<'LEAN'
          import TenthDiscriminant.Phase353DirectCellAreaCount
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_radius_interpolation_count_21
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_radius_interpolation_count_21
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.rational_margin_control
          LEAN
          set -o pipefail
          lake env lean /tmp/phase353-audit.lean 2>&1 | tee /tmp/phase353-axioms.log
          if grep -q 'sorryAx' /tmp/phase353-axioms.log; then exit 1; fi
