name: Phase387 quadratic coefficient and L-function reality
on:
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase387QuadraticReality.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/phase387-quadratic-reality.yml'
  push:
    branches: ['research/phase382-zf-three-quarters-295']
    paths:
      - 'lean/TenthDiscriminant/Phase387QuadraticReality.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/phase387-quadratic-reality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase387-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quadratic-reality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build source-matched quadratic reality theorem
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.Phase387QuadraticReality
      - name: Check theorem statements and dependencies
        run: |
          printf '%s\n' \
            'import TenthDiscriminant.Phase387QuadraticReality' \
            '#check TenthDiscriminant.Phase387.quadratic_coeff_im_zero' \
            '#check TenthDiscriminant.Phase387.quadratic_LFunction_im_zero_of_one_lt' \
            '#print axioms TenthDiscriminant.Phase387.quadratic_LFunction_im_zero_of_one_lt' \
            > /tmp/phase387_check.lean
          lake env lean /tmp/phase387_check.lean
