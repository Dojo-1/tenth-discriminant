name: E32 reduced versus nilpotent source regime (focused Lean)

on:
  push:
    branches: ['research/e32-nilpotent-to-split-regime']
    paths:
      - 'lean/TenthDiscriminant/E32RegimeNilpotentSplit.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e32-regime-nilpotent-split.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e32-regime-nilpotent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E32RegimeNilpotentSplit 2>&1 | tee /tmp/e32.log
          if grep -q 'sorryAx' /tmp/e32.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e32-audit.lean <<'LEAN'
          import TenthDiscriminant.E32RegimeNilpotentSplit
          #check TenthDiscriminant.E32.no_injective_zero_square_compatible_map
          #print axioms TenthDiscriminant.E32.source_mod5_has_nonzero_squarezero
          #print axioms TenthDiscriminant.E32.target_mod5_squarezero_implies_zero
          #print axioms TenthDiscriminant.E32.conductor_frame_kills_nilpotent
          #print axioms TenthDiscriminant.E32.conductor_frame_preserves_mul
          #print axioms TenthDiscriminant.E32.no_injective_zero_square_compatible_map
          LEAN
          set -o pipefail
          lake env lean /tmp/e32-audit.lean | tee /tmp/e32-axioms.log
          if grep -q 'sorryAx' /tmp/e32-axioms.log; then exit 1; fi
