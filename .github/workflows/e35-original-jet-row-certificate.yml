name: E35 universal original-jet row certificate (focused Lean)

on:
  push:
    branches: ['research/e35-original-ordinary-jet-row-cert']
    paths:
      - 'lean/TenthDiscriminant/E35OriginalJetRowCertificate.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e35-original-jet-row-certificate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e35-source-jet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E35OriginalJetRowCertificate 2>&1 | tee /tmp/e35.log
          if grep -q 'sorryAx' /tmp/e35.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e35-audit.lean <<'LEAN'
          import TenthDiscriminant.E35OriginalJetRowCertificate
          #check TenthDiscriminant.E35.original_two_row_jet_factor
          #check TenthDiscriminant.E35.qunit_fails_jet_row_certificate
          #print axioms TenthDiscriminant.E35.original_two_row_jet_factor
          #print axioms TenthDiscriminant.E35.qfive_original_jet_row_is_divisible
          #print axioms TenthDiscriminant.E35.qfive_jet_certificate_for_gram_factor
          #print axioms TenthDiscriminant.E35.qunit_fails_jet_row_certificate
          LEAN
          set -o pipefail
          lake env lean /tmp/e35-audit.lean | tee /tmp/e35-axioms.log
          if grep -q 'sorryAx' /tmp/e35-axioms.log; then exit 1; fi
