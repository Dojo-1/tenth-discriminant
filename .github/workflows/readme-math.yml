name: README mathematical Markdown sanity
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/check_readme_math.py
      - .github/workflows/readme-math.yml
  pull_request:
    paths:
      - README.md
      - scripts/check_readme_math.py
      - .github/workflows/readme-math.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-readme-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check displayed and inline mathematics source
        run: python3 scripts/check_readme_math.py README.md
