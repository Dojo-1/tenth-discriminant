name: Phase328 Lean original-Gram source return
on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - lean/TenthDiscriminant/Phase328StabilizedSourceReturn.lean
      - lean/TenthDiscriminant/Phase328MovingFrameCovariance.lean
      - .github/workflows/phase328-lean-source-return.yml
  workflow_dispatch:
concurrency:
  group: phase328-lean-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact source-to-stabilization entrywise Lean proof
        run: |
          lake update
          lake exe cache get
          lean --version
          set -o pipefail
          lake build TenthDiscriminant.Phase328StabilizedSourceReturn TenthDiscriminant.Phase328MovingFrameCovariance 2>&1 | tee /tmp/phase328-lean.log
          if grep -q 'sorryAx' /tmp/phase328-lean.log; then echo 'Unproved sorryAx'; exit 1; fi
