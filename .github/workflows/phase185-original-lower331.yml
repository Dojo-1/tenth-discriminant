name: Phase185 original odd-prime lower at fourth-root 331
on:
  push:
    branches: ['research/phase185-331-odd-lower']
    paths:
      - lean/TenthDiscriminant/Scalar331.lean
      - lean/TenthDiscriminant/Lower331.lean
      - research/thin_integrated/PHASE185_ORIGINAL_LOWER331.md
      - .github/workflows/phase185-original-lower331.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/Scalar331.lean
      - lean/TenthDiscriminant/Lower331.lean
      - research/thin_integrated/PHASE185_ORIGINAL_LOWER331.md
      - .github/workflows/phase185-original-lower331.yml
permissions:
  contents: read
jobs:
  lower-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source identity, nonclaims and negative controls
        working-directory: .
        run: |
          cmp research/thin_integrated/Phase183Scalar331.lean lean/TenthDiscriminant/Scalar331.lean
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lean/TenthDiscriminant/Lower331.lean').read_text()
          gates = ('import TenthDiscriminant.Scalar331',
                   'theorem normalized_lower_331',
                   'theorem recovered_normalized_lower_331',
                   'theorem normalized_source_gram_lower_331',
                   'integerRectangularTraceGram', 'exactOddPrimeMass',
                   'binaryNullGramExponent')
          for x in gates:
              assert x in src, x
          assert 'log_floor_from_331_fourth_power' in src
          assert '23.7 theorem' not in src
          assert '375' not in src
          for x in ('sorry', 'admit', 'axiom'):
              assert x not in src, x
          print('PHASE185_ORIGINAL_SOURCE_CHECK_PASS')
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source lower modules (not field theorem)
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.Scalar331 TenthDiscriminant.Lower331
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check reader math source
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE185_ORIGINAL_LOWER331.md
