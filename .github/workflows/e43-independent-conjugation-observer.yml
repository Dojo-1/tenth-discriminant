name: E43 injective independent conjugation observer (focused Lean)

on:
  push:
    branches: ['research/e43-independent-conjugation-observer']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e43-conjugation-observer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E43IndependentConjugationObserver 2>&1 | tee /tmp/e43.log
          if grep -q 'sorryAx' /tmp/e43.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e43-audit.lean <<'LEAN'
          import TenthDiscriminant.E43IndependentConjugationObserver
          #check TenthDiscriminant.E43.original_gram_invariant_under_injective_pointwise_conjugations
          #check TenthDiscriminant.E43.non_global_partial_sign_collision_all_original_jets
          #print axioms TenthDiscriminant.E43.original_gram_invariant_under_injective_pointwise_conjugations
          #print axioms TenthDiscriminant.E43.flipRealOne_involution
          #print axioms TenthDiscriminant.E43.non_global_partial_sign_collision_all_original_jets
          #print axioms TenthDiscriminant.E43.noninjective_flip_changes_original_gram
          LEAN
          set -o pipefail
          lake env lean /tmp/e43-audit.lean | tee /tmp/e43-axioms.log
          if grep -q 'sorryAx' /tmp/e43-axioms.log; then exit 1; fi
