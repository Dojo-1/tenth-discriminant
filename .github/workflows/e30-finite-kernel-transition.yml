name: E30 finite kernel transition and missing-target controls (focused Lean)

on:
  push:
    branches: ['research/e30-finite-kernel-transition-controls']
    paths:
      - 'lean/TenthDiscriminant/E30FiniteKernelTransition.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e30-finite-kernel-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e30-finite-kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E30FiniteKernelTransition 2>&1 | tee /tmp/e30.log
          if grep -q 'sorryAx' /tmp/e30.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e30-audit.lean <<'LEAN'
          import TenthDiscriminant.E30FiniteKernelTransition
          #check TenthDiscriminant.E30.mod4_kernel_reduces_zero_mod2
          #check TenthDiscriminant.E30.mod8_source_ambiguity_and_target_obstruction
          #print axioms TenthDiscriminant.E30.mod4_kernel_reduces_zero_mod2
          #print axioms TenthDiscriminant.E30.mod8_kernel_reduces_zero_mod4
          #print axioms TenthDiscriminant.E30.mod16_kernel_reduces_zero_mod8
          #print axioms TenthDiscriminant.E30.mod32_kernel_reduces_zero_mod16
          #print axioms TenthDiscriminant.E30.mod4_observer_collision_implies_mod2_equality
          #print axioms TenthDiscriminant.E30.mod8_source_ambiguity_and_target_obstruction
          LEAN
          set -o pipefail
          lake env lean /tmp/e30-audit.lean | tee /tmp/e30-axioms.log
          if grep -q 'sorryAx' /tmp/e30-axioms.log; then exit 1; fi
