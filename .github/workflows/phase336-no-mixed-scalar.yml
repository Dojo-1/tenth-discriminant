name: Phase336 313 radius and no-mixed scalar certificate
on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase336ScalarRadius313.lean'
      - 'research/phase336/test_*.py'
      - '.github/workflows/phase336-no-mixed-scalar.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase336ScalarRadius313.lean'
      - 'research/phase336/test_*.py'
      - '.github/workflows/phase336-no-mixed-scalar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase336-no-mixed-scalar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove-313-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact rational comparison and old-bound negative control
        working-directory: .
        run: python3 -m unittest discover -s research/phase336 -p 'test_*.py' -v
      - name: Build 313 source-radius and no-mixed scalar lemmas
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase336ScalarRadius313 2>&1 | tee /tmp/phase336-build.log
          if grep -q 'sorryAx' /tmp/phase336-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Inspect exact theorem types and axioms
        run: |
          cat > /tmp/phase336-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase336ScalarRadius313
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_radius_fraction_17_20_313
          #check TenthDiscriminant.Phase336.strong_scalar_separation_313_without_mixed
          #check TenthDiscriminant.Phase336.no_scalar_overlap_313_without_mixed
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_radius_fraction_17_20_313
          #print axioms TenthDiscriminant.Phase336.strong_scalar_separation_313_without_mixed
          #print axioms TenthDiscriminant.Phase336.no_scalar_overlap_313_without_mixed
          LEAN
          set -o pipefail
          lake env lean /tmp/phase336-axioms.lean | tee /tmp/phase336-axioms.log
          if grep -q 'sorryAx' /tmp/phase336-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
