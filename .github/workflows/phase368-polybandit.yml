name: Phase368 polycosmic adversarial bandit safety tests
on:
  push:
    branches: ['research/phase368-polycosmic-adversarial-bandit']
    paths:
      - 'research/phase368/**'
      - '.github/workflows/phase368-polybandit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase368-polybandit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guarded-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate manifest, source anchors, Python safety controls
        run: |
          python3 -m json.tool research/phase368/manifest.json >/dev/null
          python3 scripts/phase365_lean_anchor_guard.py
          python3 -m py_compile research/phase368/polybandit.py research/phase368/test_polybandit.py
          python3 -m unittest discover -s research/phase368 -p 'test_*.py' -v
      - name: Dry-run allocation only (never execute research work)
        run: |
          python3 research/phase368/polybandit.py --budget 4 --rounds 5 --phase meso
  prolog-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install GNU Prolog 1.4.5 from Ubuntu Noble
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gprolog
          gprolog --version
      - name: Fail-closed source and authority checks
        run: |
          set -o pipefail
          gprolog --consult-file research/phase368/governance.pl --query-goal phase368_main 2>&1 | tee /tmp/phase368-prolog.log
          if grep -E 'uncaught exception|warning: unknown directive|^FAIL |error\(' /tmp/phase368-prolog.log; then exit 1; fi
          grep -q '^PHASE368_GUARD_PASS' /tmp/phase368-prolog.log
          test "$(grep -c '^PASS ' /tmp/phase368-prolog.log)" -eq 12
