name: Phase134 selected minor rank/divisor compatibility
on:
  push:
    branches: ['research/phase134-same-matrix-minors']
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/RankDivisorCompatibility.lean'
      - '.github/workflows/phase134-minors-lean.yml'
permissions:
  contents: read
concurrency:
  group: phase134-minors-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pinned dependencies and exact head
        run: |
          lake update
          lake exe cache get
          lean --version
          git rev-parse HEAD
      - name: Focused selected minors, positive weight and prime obstruction
        run: |
          lake build TenthDiscriminant.RankDivisorCompatibility
