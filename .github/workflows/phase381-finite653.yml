name: Phase381 source-matched finite653 Lean gate
on:
  push:
    branches: ['research/phase381-lean-finite653']
    paths:
      - 'lean/TenthDiscriminant/Phase381Finite653.lean'
      - 'research/phase381/**'
      - '.github/workflows/phase381-finite653.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase381Finite653.lean'
      - 'research/phase381/**'
      - '.github/workflows/phase381-finite653.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase381-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-matched-finite653:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Independent source mirror and explicit false-positive control
        run: python3 research/phase381/sieve_source_mirror.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        working-directory: lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact Phase381 Lean theorem
        working-directory: lean
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.Phase381Finite653
      - name: Report transitive axioms and statement types
        working-directory: lean
        run: |
          printf '%s\n' \
            'import TenthDiscriminant.Phase381Finite653' \
            '#check TenthDiscriminant.phase381_sieve_candidates_below_653' \
            '#check TenthDiscriminant.phase381_classNumber_one_candidates_below_653' \
            '#check TenthDiscriminant.phase381_actual_discriminant_candidates_below_653' \
            '#print axioms TenthDiscriminant.phase381_classNumber_one_candidates_below_653' \
            '#print axioms TenthDiscriminant.phase381_actual_discriminant_candidates_below_653' \
            > /tmp/phase381_axioms.lean
          lake env lean /tmp/phase381_axioms.lean
