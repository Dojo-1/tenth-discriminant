name: Phase146 translation and Newton exact controls
on:
  push:
    branches:
      - research/phase146-translation-newton-frame
    paths:
      - research/reverse_determinant/**
      - research/ellipsoid_trimming/phase140_exact_trim.py
      - .github/workflows/phase146-finite.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned SymPy
        run: python3 -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Preserve Phase144 finite minimum
        run: python3 research/reverse_determinant/phase144_minimum_support.py
      - name: Preserve Phase145 parity and gluing controls
        run: python3 research/reverse_determinant/phase145_ortho_anti_ambig.py
      - name: Run Phase146 exact transport, negative, and finite-difference controls
        run: python3 research/reverse_determinant/phase146_translation_newton.py
