name: Phase293-A exact local-field source moment remainder
on:
  push:
    branches: ['research/phase293-*']
  pull_request:
    paths:
      - 'research/phase293/**'
      - '.github/workflows/phase293-moment-remainder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-moment-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python source syntax
        run: python3 -m py_compile research/phase293/moment_transport_remainder.py
      - name: D583/D587 original jets and formal p5 local isometry
        run: python3 -u research/phase293/moment_transport_remainder.py
