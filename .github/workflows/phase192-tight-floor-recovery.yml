name: Phase192 source-floor p3 p5 recovery
on:
  push:
    branches: ['research/phase192-tight-floor-recovery']
    paths:
      - lean/TenthDiscriminant/RecoveryGainFloorRatio.lean
      - research/thin_integrated/PHASE192_TIGHT_FLOOR_RECOVERY.md
      - .github/workflows/phase192-tight-floor-recovery.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/RecoveryGainFloorRatio.lean
      - research/thin_integrated/PHASE192_TIGHT_FLOOR_RECOVERY.md
      - .github/workflows/phase192-tight-floor-recovery.yml
permissions:
  contents: read
jobs:
  floor-recovery-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze original prime sources and exact integer floor guard
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path("lean/TenthDiscriminant/RecoveryGainFloorRatio.lean").read_text()
          old=Path("lean/TenthDiscriminant/RecoveryGainSharpRatio.lean").read_text()
          assert "import TenthDiscriminant.RecoveryGainSharpRatio" in f
          assert "saturated_rows_lower_weight R S 3" in f
          assert "saturated_rows_lower_weight R S 5" in f
          assert "hfloor : R ≤ 25*S+24" in f
          assert "895/10000" in f
          assert "1399497201/25000000" in f and "62500500001/100000000" in f
          from fractions import Fraction as F
          budget=F(1399497201,25000000)-F(895,10000)*F(62500500001,100000000)
          assert budget == F(41940539105,1000000000000) and budget > 0
          assert "theorem floor_ratio_recovery_rational_budget" in f
          assert "recovery_log_controls" in f
          assert "strong_raw_normalized_add_gain_floor_ratio_le_recovered" in f
          assert "strong_raw_normalized_add_gain_sharp_ratio_le_recovered" in old
          for bad in ("sorry","admit","axiom "):
              assert bad not in f, bad
          print("PHASE192_ORIGINAL_P3_P5_TIGHT_FLOOR_PASS")
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact original p3/p5 floor ratio 0.0895
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.RecoveryGainFloorRatio
      - name: Check exact proof dependencies
        run: |
          printf '%s\n' 'import TenthDiscriminant.RecoveryGainFloorRatio' '#check TenthDiscriminant.FirstCertificate.strong_raw_normalized_add_gain_floor_ratio_le_recovered' '#print axioms TenthDiscriminant.FirstCertificate.strong_raw_normalized_add_gain_floor_ratio_le_recovered' > /tmp/phase192_axioms.lean
          lake env lean /tmp/phase192_axioms.lean
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check mathematical Markdown
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE192_TIGHT_FLOOR_RECOVERY.md
