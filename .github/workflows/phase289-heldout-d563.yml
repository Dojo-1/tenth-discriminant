name: Phase289 held-out original D563 quartet scaling check
on:
  push:
    branches: ['research/phase289-*']
  pull_request:
    paths:
      - 'research/phase289/**'
      - '.github/workflows/phase289-heldout-d563.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-heldout-563:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile exact held-out source
        run: python3 -m py_compile research/phase289/heldout_d563.py
      - name: Reproduce full 700-row partition and original D563 source moments
        run: python3 -u research/phase289/heldout_d563.py
