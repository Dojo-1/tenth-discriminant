name: Phase190 unchanged-prime sharpened recovery ratio
on:
  push:
    branches: ['research/phase190-sharp-prime-gain']
    paths:
      - lean/TenthDiscriminant/RecoveryGainSharpRatio.lean
      - research/thin_integrated/PHASE190_SHARP_RATIO_GAIN.md
      - .github/workflows/phase190-sharp-prime-gain.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/RecoveryGainSharpRatio.lean
      - research/thin_integrated/PHASE190_SHARP_RATIO_GAIN.md
      - .github/workflows/phase190-sharp-prime-gain.yml
permissions:
  contents: read
jobs:
  recovery-ratio-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze original prime sources and ratio guard
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path("lean/TenthDiscriminant/RecoveryGainSharpRatio.lean").read_text()
          old=Path("lean/TenthDiscriminant/StrongSmallPrimeRecoveryGain.lean").read_text()
          assert "import TenthDiscriminant.StrongSmallPrimeRecoveryGain" in f
          assert "saturated_rows_lower_weight R S 3" in f
          assert "saturated_rows_lower_weight R S 5" in f
          assert "h251 : 10*R ≤ 251*S" in f
          assert "879/10000" in f
          assert "277101/5000" in f and "63001/100" in f
          assert "theorem sharp_smallprime_rational_budget" in f
          assert "recovery_log_controls" in f
          assert "strong_raw_normalized_add_gain_sharp_ratio_le_recovered" in f
          assert "strong_raw_normalized_add_gain_le_recovered" in old
          for bad in ("sorry","admit","axiom "):
              assert bad not in f, bad
          print("PHASE190_FROZEN_ORIGINAL_P3_P5_SOURCE_PASS")
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact source-prime ratio strengthening
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.RecoveryGainSharpRatio
      - name: Check exact proof dependencies
        run: |
          printf '%s\n' 'import TenthDiscriminant.RecoveryGainSharpRatio' '#check TenthDiscriminant.FirstCertificate.strong_raw_normalized_add_gain_sharp_ratio_le_recovered' '#print axioms TenthDiscriminant.FirstCertificate.strong_raw_normalized_add_gain_sharp_ratio_le_recovered' > /tmp/phase190_axioms.lean
          lake env lean /tmp/phase190_axioms.lean
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check mathematical Markdown
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE190_SHARP_RATIO_GAIN.md
