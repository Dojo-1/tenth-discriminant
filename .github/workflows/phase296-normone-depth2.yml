name: Phase296-B exhaustive norm-one p25 local-affine transport
on:
  push:
    branches: ['research/phase296-*']
  pull_request:
    paths:
      - 'research/phase296/**'
      - '.github/workflows/phase296-normone-depth2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-37500-norm-one-affine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact Python source syntax
        run: python3 -m py_compile research/phase296/normone_affine_depth2.py
      - name: Exhaust 37,500 original Q383 norm-one A25-affine frames at p25
        run: python3 -u research/phase296/normone_affine_depth2.py
