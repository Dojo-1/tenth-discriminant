name: Phase183 same-source 331 interpolation geometry (standalone Lean)
on:
  push:
    branches: ['research/phase183-source-geometry-331']
    paths:
      - research/thin_integrated/Phase183SourceGeometry331.lean
      - research/thin_integrated/PHASE183_SOURCE_GEOMETRY331.md
      - .github/workflows/phase183-source-geometry.yml
  pull_request:
    paths:
      - research/thin_integrated/Phase183SourceGeometry331.lean
      - research/thin_integrated/PHASE183_SOURCE_GEOMETRY331.md
      - .github/workflows/phase183-source-geometry.yml
permissions:
  contents: read
jobs:
  geometry-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Lean and build source prerequisites
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.ThinEllipseCount TenthDiscriminant.ThinRadiusAnalyticGain
      - name: Compile source-exact 331 original-ellipse geometry
        run: lake env lean ../research/thin_integrated/Phase183SourceGeometry331.lean
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject broken mathematical Markdown
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE183_SOURCE_GEOMETRY331.md
