name: E18 elementary Euclid-300 guards (focused Lean)

on:
  push:
    branches: ['research/e18-uniform-euclid-guards']
    paths:
      - 'lean/TenthDiscriminant/E18EuclidGuards300.lean'
      - '.github/workflows/e18-euclid-guards-300.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e18-euclid-guards
  cancel-in-progress: true

jobs:
  e18-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact elementary E18 production guards
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E18EuclidGuards300 2>&1 | tee /tmp/e18.log
          if grep -q 'sorryAx' /tmp/e18.log; then exit 1; fi
      - name: Exact theorem and axioms
        run: |
          cat >/tmp/e18-axioms.lean <<'LEAN'
          import TenthDiscriminant.E18EuclidGuards300
          #check TenthDiscriminant.E18.euclid_radius_over_R_300
          #check TenthDiscriminant.E18.euclid_log_ratio_ge_one_300
          #print axioms TenthDiscriminant.E18.euclid_radius_over_R_300
          #print axioms TenthDiscriminant.E18.euclid_log_ratio_ge_one_300
          LEAN
          set -o pipefail
          lake env lean /tmp/e18-axioms.lean | tee /tmp/e18-axioms.log
          if grep -q 'sorryAx' /tmp/e18-axioms.log; then exit 1; fi
