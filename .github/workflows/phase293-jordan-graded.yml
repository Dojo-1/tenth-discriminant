name: Phase293-B original primitive p5 graded Jordan symbols
on:
  push:
    branches: ['research/phase293-*']
  pull_request:
    paths:
      - 'research/phase293/**'
      - '.github/workflows/phase293-jordan-graded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primitive-graded-jordan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned modular arithmetic environment
        run: |
          python3 -m venv /tmp/phase293
          /tmp/phase293/bin/python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Python source syntax
        run: /tmp/phase293/bin/python -m py_compile research/phase293/primitive_graded_jordan.py
      - name: Compare D583 full and D587 725-row primitive pairing Jordan signs
        run: /tmp/phase293/bin/python -u research/phase293/primitive_graded_jordan.py
