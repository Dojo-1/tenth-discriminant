name: Phase363 same original 301 fourth-power binary-odd lower
on:
  push:
    branches: ['research/phase363-301-original-joint-lower']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase363-original-lower-${{ github.ref }}
  cancel-in-progress: true
jobs:
  joint-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build original 301 joint lower and dimension guards
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase363JointLower301 2>&1 | tee /tmp/phase363-build.log
          if grep -q 'sorryAx' /tmp/phase363-build.log; then exit 1; fi
      - name: Print exact source theorem and transitive axioms
        run: |
          cat >/tmp/phase363-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase363JointLower301
          #check TenthDiscriminant.Phase348.original_source_joint_normalized_lower_301
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.dimensions_301
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.normalized_lower_301
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.recovered_mass_le_exact_odd_301
          #print axioms TenthDiscriminant.Phase348.original_source_joint_normalized_lower_301
          LEAN
          set -o pipefail
          lake env lean /tmp/phase363-axioms.lean 2>&1 | tee /tmp/phase363-axioms.log
          if grep -q 'sorryAx' /tmp/phase363-axioms.log; then exit 1; fi
