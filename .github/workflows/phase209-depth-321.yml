name: Phase209 divided Frobenius depth and conditional 321
on:
  pull_request:
    paths:
      - "research/phase209/**"
      - "lean/TenthDiscriminant/Phase209Scalar321.lean"
      - "lean/TenthDiscriminant/Phase209Iteration.lean"
      - "lean/TenthDiscriminant/SourceGeometry321.lean"
      - "lean/TenthDiscriminant/SourcePositivity321.lean"
      - "lean/TenthDiscriminant/Phase209ConjugateFold.lean"
      - "lean/TenthDiscriminant/Phase209DeltaCarrier.lean"
      - "lean/TenthDiscriminant/Phase209OrbitSum.lean"
      - "lean/TenthDiscriminant/Phase209WholeGramFold.lean"
      - ".github/workflows/phase209-depth-321.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Original ordinary jet and conjugate-folding source oracles
        run: python3 research/phase209/divided_derivation_probe.py
      - name: Exact weighted-column capacity and rational 321 margin
        run: python3 research/phase209/weighted_capacity_321.py
  lean-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check conditional rational 321 interface and its axioms
        run: |
          lake update
          lake exe cache get
          lean --version
          lake env lean TenthDiscriminant/Phase209Scalar321.lean
          lake env lean TenthDiscriminant/Phase209Iteration.lean
          lake build TenthDiscriminant.SourceGeometry321 TenthDiscriminant.SourcePositivity321 TenthDiscriminant.Phase209ConjugateFold TenthDiscriminant.Phase209DeltaCarrier TenthDiscriminant.Phase209OrbitSum TenthDiscriminant.Phase209WholeGramFold
          lake env lean TenthDiscriminant/SourcePositivity321.lean
          lake env lean TenthDiscriminant/Phase209ConjugateFold.lean
          lake env lean TenthDiscriminant/Phase209DeltaCarrier.lean
          lake env lean TenthDiscriminant/Phase209OrbitSum.lean
          lake env lean TenthDiscriminant/Phase209WholeGramFold.lean
