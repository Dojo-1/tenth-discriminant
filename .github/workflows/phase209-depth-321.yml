name: Phase209 divided Frobenius depth and conditional 321
on:
  pull_request:
    paths:
      - "research/phase209/**"
      - "lean/TenthDiscriminant/Phase209Scalar321.lean"
      - "lean/TenthDiscriminant/Phase209Iteration.lean"
      - "lean/TenthDiscriminant/SourceGeometry321.lean"
      - "lean/TenthDiscriminant/SourcePositivity321.lean"
      - "lean/TenthDiscriminant/Phase209ConjugateFold.lean"
      - "lean/TenthDiscriminant/Phase209DeltaCarrier.lean"
      - "lean/TenthDiscriminant/Phase209OrbitSum.lean"
      - "lean/TenthDiscriminant/Phase209WholeGramFold.lean"
      - "lean/TenthDiscriminant/Phase210FoldedInertFactor.lean"
      - "lean/TenthDiscriminant/Phase210SharpOrdinaryJet.lean"
      - "lean/TenthDiscriminant/Phase210ActualNormalizedDepth.lean"
      - "lean/TenthDiscriminant/Phase210FiniteInertBudget.lean"
      - "lean/TenthDiscriminant/Phase211Anchor.lean"
      - "lean/TenthDiscriminant/Phase211RankObstruction.lean"
      - "lean/TenthDiscriminant/Phase223Support.lean"
      - "lean/TenthDiscriminant/Phase223Horizontal.lean"
      - "lean/TenthDiscriminant/Phase225Band.lean"
      - "lean/TenthDiscriminant/Phase226HorizontalIntegral.lean"
      - "lean/TenthDiscriminant/Phase227JointJets.lean"
      - "lean/TenthDiscriminant/Phase228CombinedBasis.lean"
      - "lean/TenthDiscriminant/Phase259Horizontal321.lean"
      - "lean/TenthDiscriminant/Phase259HorizontalCertificate321.lean"
      - "lean/TenthDiscriminant/Phase260EnhancedOriginalGram321.lean"
      - "lean/TenthDiscriminant/Phase261EnhancedLog321.lean"
      - "lean/TenthDiscriminant/Phase262HorizontalLogBridge321.lean"
      - "lean/TenthDiscriminant/Phase263EnhancedLower321.lean"
      - "lean/TenthDiscriminant/Phase264UpperScalars321.lean"
      - "lean/TenthDiscriminant/Phase265ThinUpper321.lean"
      - "lean/TenthDiscriminant/Phase266ScalarOverlap321.lean"
      - "lean/TenthDiscriminant/Phase267ActualField321.lean"
      - "research/phase228/**"
      - ".github/workflows/phase209-depth-321.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Original ordinary jet and conjugate-folding source oracles
        run: python3 research/phase209/divided_derivation_probe.py
      - name: Exact weighted-column capacity and rational 321 margin
        run: python3 research/phase209/weighted_capacity_321.py
      - name: Exact integral Taylor flow and sharp original-jet depth
        run: python3 research/phase209/taylor_flow_precision.py
  lean-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check conditional rational 321 interface and its axioms
        run: |
          lake update
          lake exe cache get
          lean --version
          lake env lean TenthDiscriminant/Phase209Scalar321.lean
          lake env lean TenthDiscriminant/Phase209Iteration.lean
          lake build TenthDiscriminant.SourceGeometry321 TenthDiscriminant.SourcePositivity321 TenthDiscriminant.Phase209ConjugateFold TenthDiscriminant.Phase209DeltaCarrier TenthDiscriminant.Phase209OrbitSum TenthDiscriminant.Phase209WholeGramFold TenthDiscriminant.Phase210FoldedInertFactor TenthDiscriminant.Phase210SharpOrdinaryJet TenthDiscriminant.Phase210ActualNormalizedDepth TenthDiscriminant.Phase210FiniteInertBudget TenthDiscriminant.Phase211Anchor TenthDiscriminant.Phase211RankObstruction TenthDiscriminant.Phase223Support TenthDiscriminant.Phase223Horizontal TenthDiscriminant.Phase225Band TenthDiscriminant.Phase226HorizontalIntegral TenthDiscriminant.Phase227JointJets TenthDiscriminant.Phase228CombinedBasis TenthDiscriminant.Phase259HorizontalCertificate321
          lake env lean TenthDiscriminant/SourcePositivity321.lean
          lake env lean TenthDiscriminant/Phase209ConjugateFold.lean
          lake env lean TenthDiscriminant/Phase209DeltaCarrier.lean
          lake env lean TenthDiscriminant/Phase209OrbitSum.lean
          lake env lean TenthDiscriminant/Phase209WholeGramFold.lean
          lake env lean TenthDiscriminant/Phase210FoldedInertFactor.lean
          lake env lean TenthDiscriminant/Phase210SharpOrdinaryJet.lean
          lake env lean TenthDiscriminant/Phase210ActualNormalizedDepth.lean
          lake env lean TenthDiscriminant/Phase210FiniteInertBudget.lean
          lake env lean TenthDiscriminant/Phase211Anchor.lean
          lake env lean TenthDiscriminant/Phase211RankObstruction.lean
          lake env lean TenthDiscriminant/Phase223Support.lean
          lake env lean TenthDiscriminant/Phase223Horizontal.lean
          lake env lean TenthDiscriminant/Phase225Band.lean
          lake env lean TenthDiscriminant/Phase226HorizontalIntegral.lean
          lake env lean TenthDiscriminant/Phase227JointJets.lean
          lake env lean TenthDiscriminant/Phase228CombinedBasis.lean
          lake env lean TenthDiscriminant/Phase259HorizontalCertificate321.lean
          lake build TenthDiscriminant.Phase259Horizontal321
          lake env lean TenthDiscriminant/Phase259Horizontal321.lean
          lake build TenthDiscriminant.Phase260EnhancedOriginalGram321
          lake env lean TenthDiscriminant/Phase260EnhancedOriginalGram321.lean
          lake build TenthDiscriminant.Phase261EnhancedLog321
          lake env lean TenthDiscriminant/Phase261EnhancedLog321.lean
          lake build TenthDiscriminant.Phase262HorizontalLogBridge321
          lake env lean TenthDiscriminant/Phase262HorizontalLogBridge321.lean
          lake build TenthDiscriminant.Phase263EnhancedLower321
          lake env lean TenthDiscriminant/Phase263EnhancedLower321.lean
          lake build TenthDiscriminant.Phase264UpperScalars321
          lake env lean TenthDiscriminant/Phase264UpperScalars321.lean
          lake build TenthDiscriminant.Phase265ThinUpper321
          lake env lean TenthDiscriminant/Phase265ThinUpper321.lean
          lake build TenthDiscriminant.Phase266ScalarOverlap321
          lake env lean TenthDiscriminant/Phase266ScalarOverlap321.lean
          lake build TenthDiscriminant.Phase267ActualField321
          lake env lean TenthDiscriminant/Phase267ActualField321.lean
