name: Phase202 typed source checks
on:
  pull_request:
    paths:
      - "lean/TenthDiscriminant/PlacewiseTransport.lean"
      - "research/phase202/**"
      - ".github/workflows/phase202-source-alignment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Original-source finite tests and matched controls
        run: |
          python3 research/phase202/placewise_jet_probe.py
          python3 research/phase202/matched_canonical_support.py
          python3 research/phase202/certify_mod7_rank_drop.py
          python3 research/phase202/residue_count_transport.py
          python3 research/phase202/form_pencil_f7.py
          python3 research/phase202/pencil_factorization_f49.py

  lean-source-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve exact pinned mathlib
        run: |
          lake update
          lake exe cache get
          lean --version
      - name: Compile only Phase202 source and its imports
        run: lake build TenthDiscriminant.PlacewiseTransport
      - name: Inspect exact-source theorem axioms
        run: lake env lean TenthDiscriminant/PlacewiseTransport.lean
