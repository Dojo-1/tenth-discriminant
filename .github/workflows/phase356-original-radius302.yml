name: Phase356 original padded radius 302 gate
on:
  push:
    branches: ['research/phase356-302-radius-guard']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase356-source-radius-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-radius-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Phase356 original radius guards
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase356Radius302 2>&1 | tee /tmp/phase356-build.log
          if grep -q 'sorryAx' /tmp/phase356-build.log; then exit 1; fi
      - name: Inspect transitive axioms
        run: |
          cat >/tmp/phase356-audit.lean <<'LEAN'
          import TenthDiscriminant.Phase356Radius302
          #check TenthDiscriminant.FirstCertificate.Tuned.original_radius_saving_302
          #check TenthDiscriminant.FirstCertificate.Tuned.original_76_cube_guard_false_at_302
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.R_ge_seventyfive_cubes_302
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.radius_over_R_302
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.original_radius_saving_302
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.original_76_cube_guard_false_at_302
          LEAN
          set -o pipefail
          lake env lean /tmp/phase356-audit.lean 2>&1 | tee /tmp/phase356-axioms.log
          if grep -q 'sorryAx' /tmp/phase356-axioms.log; then exit 1; fi
