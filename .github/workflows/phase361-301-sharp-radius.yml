name: Phase361 sharpened original 301 radius and conditional scalar
on:
  push:
    branches: ['research/phase361-301-stronger-original-radius']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase361-original-radius-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase361-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build 301 source-exact radius and scalar theorems
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase361StrongerRadius301 2>&1 | tee /tmp/phase361-build.log
          if grep -q 'sorryAx' /tmp/phase361-build.log; then exit 1; fi
      - name: Audit changed theorem transitive axioms
        run: |
          cat >/tmp/phase361-audit.lean <<'LEAN'
          import TenthDiscriminant.Phase361StrongerRadius301
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_radius_fraction_847_1000_301
          #check TenthDiscriminant.FirstCertificate.Tuned.original_radius_saving_301
          #check TenthDiscriminant.Phase361.no_scalar_overlap_301_with_sharp_radius
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_radius_fraction_847_1000_301
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.upperB_strong_847_1000_saving
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.original_radius_saving_301
          #print axioms TenthDiscriminant.Phase361.strong_scalar_separation_301_with_sharp_radius
          #print axioms TenthDiscriminant.Phase361.no_scalar_overlap_301_with_sharp_radius
          LEAN
          set -o pipefail
          lake env lean /tmp/phase361-audit.lean 2>&1 | tee /tmp/phase361-axioms.log
          if grep -q 'sorryAx' /tmp/phase361-axioms.log; then exit 1; fi
