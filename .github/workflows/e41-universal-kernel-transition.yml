name: E41 universal conductor-kernel transitions (focused Lean)

on:
  push:
    branches: ['research/e41-universal-conductor-kernel-transition']
    paths:
      - 'lean/TenthDiscriminant/E41UniversalKernelTransition.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e41-universal-kernel-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e41-universal-kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E41UniversalKernelTransition 2>&1 | tee /tmp/e41.log
          if grep -q 'sorryAx' /tmp/e41.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e41-audit.lean <<'LEAN'
          import TenthDiscriminant.E41UniversalKernelTransition
          #check TenthDiscriminant.E41.integral_conductor_kernel_reduces_zero
          #check TenthDiscriminant.E41.all_power_conductor_transitions
          #print axioms TenthDiscriminant.E41.integral_conductor_kernel_reduces_zero
          #print axioms TenthDiscriminant.E41.all_dyadic_kernel_transitions
          #print axioms TenthDiscriminant.E41.all_power_conductor_transitions
          #print axioms TenthDiscriminant.E41.compatible_coarse_kernel_is_zero
          #print axioms TenthDiscriminant.E41.kernel_collapse_and_missing_target_coexist
          LEAN
          set -o pipefail
          lake env lean /tmp/e41-audit.lean | tee /tmp/e41-axioms.log
          if grep -q 'sorryAx' /tmp/e41-axioms.log; then exit 1; fi
