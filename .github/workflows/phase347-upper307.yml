name: Phase347 307 original source analytic upper

on:
  push:
    branches: ['research/phase347-307-radius-transport']
    paths:
      - 'lean/TenthDiscriminant/Phase347Dimensions307.lean'
      - 'lean/TenthDiscriminant/Phase347UpperScalars307.lean'
      - 'lean/TenthDiscriminant/Phase347SourcePositivity307.lean'
      - 'lean/TenthDiscriminant/Phase347ThinUpper307.lean'
      - '.github/workflows/phase347-upper307.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase347Dimensions307.lean'
      - 'lean/TenthDiscriminant/Phase347UpperScalars307.lean'
      - 'lean/TenthDiscriminant/Phase347SourcePositivity307.lean'
      - 'lean/TenthDiscriminant/Phase347ThinUpper307.lean'
      - '.github/workflows/phase347-upper307.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase347-upper307-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upper307:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build original source 307 analytic upper
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase347Dimensions307 TenthDiscriminant.Phase347UpperScalars307 TenthDiscriminant.Phase347SourcePositivity307 TenthDiscriminant.Phase347ThinUpper307 2>&1 | tee /tmp/phase347-build.log
          if grep -q 'sorryAx' /tmp/phase347-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Exact type and axiom audit
        run: |
          cat > /tmp/phase347-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase347ThinUpper307
          #check TenthDiscriminant.FirstCertificate.Tuned.dimensions_307
          #check TenthDiscriminant.FirstCertificate.Tuned.endpoint_error_307
          #check TenthDiscriminant.FirstCertificate.Tuned.normalized_upper_307
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_original_gram_pos_307
          #check TenthDiscriminant.Phase347.thin_production_normalized_upper_stronger_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.dimensions_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.endpoint_error_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.normalized_upper_307
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_original_gram_pos_307
          #print axioms TenthDiscriminant.Phase347.thin_production_normalized_upper_stronger_307
          LEAN
          set -o pipefail
          lake env lean /tmp/phase347-axioms.lean | tee /tmp/phase347-axioms.log
          if grep -q 'sorryAx' /tmp/phase347-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
