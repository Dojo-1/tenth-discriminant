name: Phase315 corrected conductor125 wild logarithm in Lean
on:
  push:
    branches: ['research/phase315-*']
    paths:
      - 'lean/TenthDiscriminant/Phase315Conductor125.lean'
      - '.github/workflows/phase315-lean-log125.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase315Conductor125.lean'
      - '.github/workflows/phase315-lean-log125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wild-log125-corrected-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check polynomial identities, not field semantics
        run: |
          lake update
          lake exe cache get
          lean --version
          git rev-parse HEAD
          lake build TenthDiscriminant.Phase315Conductor125
          
