name: Phase329 Lean handle-slide knot and quandle laws
on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase329IntegralKnotLift.lean'
      - '.github/workflows/phase329-lean-knot-lift.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase329IntegralKnotLift.lean'
      - '.github/workflows/phase329-lean-knot-lift.yml'
  workflow_dispatch:
concurrency:
  group: phase329-lean-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integral-knot-theorems:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify integral handle-slide and quandle laws with no sorryAx
        run: |
          lake update
          lake exe cache get
          lean --version
          set -o pipefail
          lake build TenthDiscriminant.Phase329IntegralKnotLift 2>&1 | tee /tmp/phase329-lean.log
          if grep -q 'sorryAx' /tmp/phase329-lean.log; then echo 'Unproved sorryAx'; exit 1; fi
