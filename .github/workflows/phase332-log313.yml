name: Phase332 finite-series log313 certificate
on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase332Log313Certificate.lean'
      - '.github/workflows/phase332-log313.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase332-log313-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-log313:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify finite logarithm enclosure with no new axioms
        run: |
          lake update
          lake exe cache get
          lake build TenthDiscriminant.Phase332Log313Certificate
          printf '%s\n' 'import TenthDiscriminant.Phase332Log313Certificate' \
            '#print axioms TenthDiscriminant.Phase332.log_floor_from_313_fourth_power' > /tmp/phase332-log313-axioms.lean
          lake env lean /tmp/phase332-log313-axioms.lean
