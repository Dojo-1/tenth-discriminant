name: Phase338 313^4 original-Gram field candidate

on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase336ScalarRadius313.lean'
      - 'lean/TenthDiscriminant/Phase337Dimensions313.lean'
      - 'lean/TenthDiscriminant/Phase337UpperScalars313.lean'
      - 'lean/TenthDiscriminant/Phase337ThinUpper313.lean'
      - 'lean/TenthDiscriminant/Phase332SourcePositivity313.lean'
      - 'lean/TenthDiscriminant/Phase338Lower313.lean'
      - 'lean/TenthDiscriminant/Phase338JointLower313.lean'
      - 'lean/TenthDiscriminant/Phase338Field313Candidate.lean'
      - '.github/workflows/phase338-field313.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase336ScalarRadius313.lean'
      - 'lean/TenthDiscriminant/Phase337Dimensions313.lean'
      - 'lean/TenthDiscriminant/Phase337UpperScalars313.lean'
      - 'lean/TenthDiscriminant/Phase337ThinUpper313.lean'
      - 'lean/TenthDiscriminant/Phase332SourcePositivity313.lean'
      - 'lean/TenthDiscriminant/Phase338Lower313.lean'
      - 'lean/TenthDiscriminant/Phase338JointLower313.lean'
      - 'lean/TenthDiscriminant/Phase338Field313Candidate.lean'
      - '.github/workflows/phase338-field313.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase338-field313-${{ github.ref }}
  cancel-in-progress: true
jobs:
  same-original-gram-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recover exact previous 313 rational negative controls
        working-directory: .
        run: python3 -m unittest discover -s research/phase336 -p 'test_*.py' -v
      - name: Build original 313 arithmetic lower and independent analytic upper
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase338Lower313 TenthDiscriminant.Phase338JointLower313 TenthDiscriminant.Phase337ThinUpper313 TenthDiscriminant.Phase338Field313Candidate 2>&1 | tee /tmp/phase338-build.log
          if grep -q 'sorryAx' /tmp/phase338-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Check both same-source bounds and actual-field theorem axioms
        run: |
          cat > /tmp/phase338-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase338Field313Candidate
          #check TenthDiscriminant.FirstCertificate.Tuned.recovered_normalized_lower_313
          #check TenthDiscriminant.Phase338.original_source_joint_normalized_lower_313
          #check TenthDiscriminant.Phase337.thin_production_normalized_upper_stronger_313
          #check TenthDiscriminant.FirstCertificate.Tuned.thin_original_gram_pos_313
          #check TenthDiscriminant.Threshold313.totallyComplex_degree_two_classNumber_one_discriminant_bound_313
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.recovered_normalized_lower_313
          #print axioms TenthDiscriminant.Phase338.original_source_joint_normalized_lower_313
          #print axioms TenthDiscriminant.Phase337.thin_production_normalized_upper_stronger_313
          #print axioms TenthDiscriminant.Threshold313.totallyComplex_degree_two_classNumber_one_discriminant_bound_313
          LEAN
          set -o pipefail
          lake env lean /tmp/phase338-axioms.lean | tee /tmp/phase338-axioms.log
          if grep -q 'sorryAx' /tmp/phase338-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
