name: Phase358 same original 302 fourth-power thin Gram upper
on:
  push:
    branches: ['research/phase358-302-original-upper']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase358-original-upper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-upper-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build same original trace-Gram source and upper
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase358ThinUpper302 2>&1 | tee /tmp/phase358-build.log
          if grep -q 'sorryAx' /tmp/phase358-build.log; then exit 1; fi
      - name: Source-specific upper theorem and transitive axioms
        run: |
          cat >/tmp/phase358-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase358ThinUpper302
          #check TenthDiscriminant.Phase358.thin_production_normalized_upper_stronger_302
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_original_integer_gram_pos_14
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.thin_radius_interpolation_count_302
          #print axioms TenthDiscriminant.FirstCertificate.Tuned.normalized_upper_302
          #print axioms TenthDiscriminant.Phase358.thin_production_normalized_upper_stronger_302
          LEAN
          set -o pipefail
          lake env lean /tmp/phase358-axioms.lean 2>&1 | tee /tmp/phase358-axioms.log
          if grep -q 'sorryAx' /tmp/phase358-axioms.log; then exit 1; fi
