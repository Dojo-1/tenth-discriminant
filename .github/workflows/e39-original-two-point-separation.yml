name: E39 original two-point Gram separation (focused Lean)

on:
  push:
    branches: ['research/e39-original-two-point-separation']
    paths:
      - 'lean/TenthDiscriminant/E39OriginalTwoPointSeparation.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e39-original-two-point-separation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e39-original-two-point-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E39OriginalTwoPointSeparation 2>&1 | tee /tmp/e39.log
          if grep -q 'sorryAx' /tmp/e39.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e39-audit.lean <<'LEAN'
          import TenthDiscriminant.E39OriginalTwoPointSeparation
          #check TenthDiscriminant.E39.real_two_source_original_gram_det
          #check TenthDiscriminant.E39.translated_original_gram_naturality
          #print axioms TenthDiscriminant.E39.real_two_source_original_gram
          #print axioms TenthDiscriminant.E39.real_two_source_original_gram_det
          #print axioms TenthDiscriminant.E39.source_separation_forces_prime_square
          #print axioms TenthDiscriminant.E39.translated_original_gram_naturality
          #print axioms TenthDiscriminant.E39.repeated_source_collapses
          LEAN
          set -o pipefail
          lake env lean /tmp/e39-audit.lean | tee /tmp/e39-axioms.log
          if grep -q 'sorryAx' /tmp/e39-axioms.log; then exit 1; fi
