name: Phase291 full-original D563 n700 primitive p-adic gate
on:
  push:
    branches: ['research/phase291-*']
  pull_request:
    paths:
      - 'research/phase291/**'
      - '.github/workflows/phase291-full700-primitive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full700-inert5-split7:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed NumPy dependency
        run: |
          python3 -m venv /tmp/phase291
          /tmp/phase291/bin/python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Compile exact source
        run: /tmp/phase291/bin/python -m py_compile research/phase291/full700_primitive_gate.py
      - name: Original 700-row evaluation, capped Smith and conditional primitive pairing
        run: /tmp/phase291/bin/python -u research/phase291/full700_primitive_gate.py
