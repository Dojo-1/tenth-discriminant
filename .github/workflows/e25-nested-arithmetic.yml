name: E25 nested arithmetic frames (focused Lean)

on:
  push:
    branches: ['research/e24-arithmetic-worldlet-transport']
    paths:
      - 'lean/TenthDiscriminant/E25NestedArithmeticFrames.lean'
      - '.github/workflows/e25-nested-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e25-arithmetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e25-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile tower and typed partial reverse
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E25NestedArithmeticFrames 2>&1 | tee /tmp/e25.log
          if grep -q 'sorryAx' /tmp/e25.log; then exit 1; fi
      - name: Theorem types and axioms
        run: |
          cat >/tmp/e25-audit.lean <<'LEAN'
          import TenthDiscriminant.E25NestedArithmeticFrames
          #check TenthDiscriminant.E25.two_stage_originalGram
          #check TenthDiscriminant.E25.future_reverse_not_decodable_from_first_coordinate
          #print axioms TenthDiscriminant.E25.two_stage_originalGram
          #print axioms TenthDiscriminant.E25.recoverEven_after_embedding
          #print axioms TenthDiscriminant.E25.future_reverse_not_decodable_from_first_coordinate
          LEAN
          set -o pipefail
          lake env lean /tmp/e25-audit.lean | tee /tmp/e25-axioms.log
          if grep -q 'sorryAx' /tmp/e25-axioms.log; then exit 1; fi
