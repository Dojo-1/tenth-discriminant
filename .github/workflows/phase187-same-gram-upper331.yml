name: Phase187 original thin Gram analytic upper at 331
on:
  push:
    branches: ['research/phase187-same-gram-upper-331']
    paths:
      - lean/TenthDiscriminant/UpperScalars331.lean
      - lean/TenthDiscriminant/ThinUpper331.lean
      - research/thin_integrated/PHASE187_SAME_GRAM_UPPER331.md
      - .github/workflows/phase187-same-gram-upper331.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/UpperScalars331.lean
      - lean/TenthDiscriminant/ThinUpper331.lean
      - research/thin_integrated/PHASE187_SAME_GRAM_UPPER331.md
      - .github/workflows/phase187-same-gram-upper331.yml
permissions:
  contents: read
jobs:
  original-upper-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm original source and no old large-floor escape
        working-directory: ${{ github.workspace }}
        run: |
          pwd
          git rev-parse HEAD
          test -f lean/TenthDiscriminant/SourceGeometry331.lean
          test -f lean/TenthDiscriminant/SourcePositivity331.lean
          test -f lean/TenthDiscriminant/Lower331.lean
          python3 - <<'PY'
          from pathlib import Path
          a = Path('lean/TenthDiscriminant/UpperScalars331.lean').read_text()
          b = Path('lean/TenthDiscriminant/ThinUpper331.lean').read_text()
          geo = Path('lean/TenthDiscriminant/SourceGeometry331.lean').read_text()
          pos = Path('lean/TenthDiscriminant/SourcePositivity331.lean').read_text()
          assert 'theorem radius_over_R_331' in geo and '521/80000' in geo
          assert 'thin_original_gram_pos_331' in pos
          assert 'log_floor_from_331_fourth_power' in a
          assert 'normalized_upper_331' in a
          assert 'thin_radius_guards_331' in a
          assert 'thin_card_le_old_padded_majorant_331' in b
          assert 'normalized_integer_upper_tight' in b
          assert 'theorem thin_production_normalized_upper_331' in b
          assert 'ellipsePairs D (Tuned.thinRadius D)' in b
          assert 'integerRectangularTraceGram' in b
          assert 'Real.log' in a and 'comparisonScale' in b
          assert 'import TenthDiscriminant.SourcePositivity331' in b
          for s in (a,b):
              for bad in ('sorry', 'admit', 'axiom', '_375',
                          'log_large_from_375_fourth_power','R_ge_ninety_cubes'):
                  assert bad not in s, bad
          print('PHASE187_SAME_SOURCE_UPPER_GUARD_PASS', flush=True)
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original analytic upper 331 sources
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.UpperScalars331 TenthDiscriminant.ThinUpper331
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check readable mathematical markup
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE187_SAME_GRAM_UPPER331.md
