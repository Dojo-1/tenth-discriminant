name: E31 original-Gram conductor-kernel counterexample (focused Lean)

on:
  push:
    branches: ['research/e31-conductor-gram-counterexample']
    paths:
      - 'lean/TenthDiscriminant/E31ConductorGramNegative.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e31-conductor-gram-negative.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e31-conductor-gram-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E31ConductorGramNegative 2>&1 | tee /tmp/e31.log
          if grep -q 'sorryAx' /tmp/e31.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e31-audit.lean <<'LEAN'
          import TenthDiscriminant.E31ConductorGramNegative
          #check TenthDiscriminant.E31.actual_original_gram_det_four
          #check TenthDiscriminant.E31.ambient_kernel_does_not_force_gram_five
          #print axioms TenthDiscriminant.E31.actual_original_gram_matrix
          #print axioms TenthDiscriminant.E31.actual_original_gram_det_four
          #print axioms TenthDiscriminant.E31.original_gram_image_transport
          #print axioms TenthDiscriminant.E31.mod5_conductor_five_not_injective
          #print axioms TenthDiscriminant.E31.ambient_kernel_does_not_force_gram_five
          LEAN
          set -o pipefail
          lake env lean /tmp/e31-audit.lean | tee /tmp/e31-axioms.log
          if grep -q 'sorryAx' /tmp/e31-axioms.log; then exit 1; fi
