name: Round201 isolated Lean loss-observation counterworld
on:
  push:
    branches: ['research/round201-blueprint-loss-ledger']
    paths:
      - lean/TenthDiscriminant/LossLedger201.lean
      - .github/workflows/round201-lean.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-lemma:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact isolated mathematical statements
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.LossLedger201
          printf '%s\n' 'import TenthDiscriminant.LossLedger201' \
            '#check TenthDiscriminant.LossLedger201.same_entry_three_divisibility' \
            '#check TenthDiscriminant.LossLedger201.different_three_adic_det_depth' \
            '#check TenthDiscriminant.LossLedger201.entry_three_mask_not_faithful' \
            '#check TenthDiscriminant.LossLedger201.three_kernel_mod_nine_reduces_to_zero' \
            '#check TenthDiscriminant.LossLedger201.three_kernel_mod_three_has_nonliftable_class' \
            '#print axioms TenthDiscriminant.LossLedger201.three_kernel_mod_three_has_nonliftable_class' \
            '#print axioms TenthDiscriminant.LossLedger201.entry_three_mask_not_faithful' \
            > /tmp/round201_axioms.lean
          lake env lean /tmp/round201_axioms.lean
      - name: Forbid holes in the new research module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("TenthDiscriminant/LossLedger201.lean")
          t=p.read_text()
          assert 'sorry' not in t and 'admit' not in t
          assert 'axiom ' not in t
          print('ROUND201_LEAN_SCOPE_PASS')
          PY
