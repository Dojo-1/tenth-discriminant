name: E30 finite adic persistence vs missing targets (focused Lean)

on:
  push:
    branches: ['research/e30-adic-persistence-counterworld']
    paths:
      - 'lean/TenthDiscriminant/E30AdicPersistence.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e30-adic-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e30-adic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e30-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile finite source-kernel and target-obstruction tests
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E30AdicPersistence 2>&1 | tee /tmp/e30.log
          if grep -q 'sorryAx' /tmp/e30.log; then exit 1; fi
      - name: Axiom audit finite proof certificates
        run: |
          cat >/tmp/e30-audit.lean <<'LEAN'
          import TenthDiscriminant.E30AdicPersistence
          #check TenthDiscriminant.E30.kernel_size_mod16
          #check TenthDiscriminant.E30.no_nonzero_source_kernel_lift_from_two
          #print axioms TenthDiscriminant.E30.kernel_size_mod16
          #print axioms TenthDiscriminant.E30.mod16_kernel_projects_zero
          #print axioms TenthDiscriminant.E30.no_nonzero_source_kernel_lift_from_two
          #print axioms TenthDiscriminant.E30.coherent_three_level_kernel_is_zero_at_four
          #print axioms TenthDiscriminant.E30.odd_target_missing_mod16
          LEAN
          set -o pipefail
          lake env lean /tmp/e30-audit.lean | tee /tmp/e30-axioms.log
          if grep -q 'sorryAx' /tmp/e30-axioms.log; then exit 1; fi
