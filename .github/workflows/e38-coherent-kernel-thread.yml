name: E38 all-depth coherent kernel thread (focused Lean)

on:
  push:
    branches: ['research/e38-coherent-kernel-thread']
    paths:
      - 'lean/TenthDiscriminant/E38CoherentKernelThread.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e38-coherent-kernel-thread.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e38-coherent-kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E38CoherentKernelThread 2>&1 | tee /tmp/e38.log
          if grep -q 'sorryAx' /tmp/e38.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e38-audit.lean <<'LEAN'
          import TenthDiscriminant.E38CoherentKernelThread
          #check TenthDiscriminant.E38.coherent_kernel_thread_is_zero
          #check TenthDiscriminant.E38.finite_kernel_is_nonzero_every_depth
          #print axioms TenthDiscriminant.E38.kernel_transition_all_depths
          #print axioms TenthDiscriminant.E38.finite_kernel_is_nonzero_every_depth
          #print axioms TenthDiscriminant.E38.target_one_missing_all_depths
          #print axioms TenthDiscriminant.E38.coherent_kernel_thread_is_zero
          #print axioms TenthDiscriminant.E38.compatible_kernel_iff_zero_thread
          LEAN
          set -o pipefail
          lake env lean /tmp/e38-audit.lean | tee /tmp/e38-axioms.log
          if grep -q 'sorryAx' /tmp/e38-axioms.log; then exit 1; fi
