name: Phase292 matched inert-p5 original D563 and D587
on:
  push:
    branches: ['research/phase292-*']
  pull_request:
    paths:
      - 'research/phase292/**'
      - '.github/workflows/phase292-matched-inert5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-D587-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned NumPy
        run: |
          python3 -m venv /tmp/phase292
          /tmp/phase292/bin/python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Compile cross-discriminant exact source
        run: /tmp/phase292/bin/python -m py_compile research/phase292/matched_inert5_neighbor.py
      - name: D563 reproducibility and D587 original full source with capped primitive gate
        run: /tmp/phase292/bin/python -u research/phase292/matched_inert5_neighbor.py
