name: E37 source no-fake unimodular prime certificate (focused Lean)

on:
  push:
    branches: ['research/e37-source-certificate-no-fake']
    paths:
      - 'lean/TenthDiscriminant/E37SourceCertificateNoFake.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e37-source-no-fake.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e37-source-no-fake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E37SourceCertificateNoFake 2>&1 | tee /tmp/e37.log
          if grep -q 'sorryAx' /tmp/e37.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e37-audit.lean <<'LEAN'
          import TenthDiscriminant.E37SourceCertificateNoFake
          #check TenthDiscriminant.E37.unit_source_has_no_unimodular_five_factor
          #check TenthDiscriminant.E37.shifted_source_factor_via_generic_gram_theorem
          #print axioms TenthDiscriminant.E37.shifted_source_has_integral_factor
          #print axioms TenthDiscriminant.E37.shifted_source_factor_via_generic_gram_theorem
          #print axioms TenthDiscriminant.E37.unit_source_has_no_unimodular_five_factor
          #print axioms TenthDiscriminant.E37.fake_transport_not_an_admissible_witness
          LEAN
          set -o pipefail
          lake env lean /tmp/e37-audit.lean | tee /tmp/e37-axioms.log
          if grep -q 'sorryAx' /tmp/e37-axioms.log; then exit 1; fi
