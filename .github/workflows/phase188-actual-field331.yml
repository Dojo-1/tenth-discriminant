name: Phase188 actual-field 331 candidate, same Gram proof gate
on:
  push:
    branches: ['research/phase188-actual-field-331-candidate']
    paths:
      - lean/TenthDiscriminant/ActualField331.lean
      - research/thin_integrated/PHASE188_ACTUAL_FIELD331_CANDIDATE.md
      - .github/workflows/phase188-actual-field331.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/ActualField331.lean
      - research/thin_integrated/PHASE188_ACTUAL_FIELD331_CANDIDATE.md
      - .github/workflows/phase188-actual-field331.yml
permissions:
  contents: read
jobs:
  actual-field-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check precise source links and absence of shortcut
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("lean/TenthDiscriminant/ActualField331.lean").read_text()
          lo = Path("lean/TenthDiscriminant/SameGramLower331.lean").read_text()
          hi = Path("lean/TenthDiscriminant/ThinUpper331.lean").read_text()
          required = (
            "import TenthDiscriminant.ThinUpper331",
            "import TenthDiscriminant.SameGramLower331",
            "import TenthDiscriminant.Scalar331",
            "thin_production_normalized_upper_331",
            "thin_original_odd_plus_binary_normalized_lower_331",
            "no_abstract_scalar_overlap_331",
            "theorem totallyComplex_degree_two_classNumber_one_discriminant_bound_331",
            "NumberField.discr_eq_discr_of_algEquiv",
            "quadraticChartEquiv",
            "even_classNumber_ne_one"
          )
          assert all(x in source for x in required)
          assert "integerRectangularTraceGram" in lo and "integerRectangularTraceGram" in hi
          assert "ellipsePairs D (FirstCertificate.Tuned.thinRadius D)" in lo
          assert "ellipsePairs D (Tuned.thinRadius D)" in hi
          assert "recovered_mass_le_exact_odd_331" in lo
          assert "normalized_binary_quarter" in lo
          for code in (source, lo, hi):
              for token in ("sorry", "admit", "axiom "):
                  assert token not in code, token
          assert "thin_production_normalized_upper_375" not in source
          assert "odd_large_classNumber_ne_one_375" not in source
          print("PHASE188_SOURCE_MATCHED_SAME_GRAM_PASS")
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact 331 field theorem (no production root import)
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.ActualField331
      - name: Inspect exported theorem and explicit axiom dependencies
        run: |
          printf '%s\n' 'import TenthDiscriminant.ActualField331' '#check TenthDiscriminant.Threshold331.totallyComplex_degree_two_classNumber_one_discriminant_bound_331' '#print axioms TenthDiscriminant.Threshold331.totallyComplex_degree_two_classNumber_one_discriminant_bound_331' > /tmp/phase188_axioms.lean
          lake env lean /tmp/phase188_axioms.lean
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate mathematical Markdown
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE188_ACTUAL_FIELD331_CANDIDATE.md
