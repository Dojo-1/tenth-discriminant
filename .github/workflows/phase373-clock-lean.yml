name: Phase373 clock authority Lean
on:
  push:
    branches: ['research/phase373-clock-authority-square']
    paths:
      - 'lean/TenthDiscriminant/Phase373ClockAuthoritySquare.lean'
      - '.github/workflows/phase373-clock-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase373-clock-lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-clock-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile explicit clock-authority square
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase373ClockAuthoritySquare 2>&1 | tee /tmp/phase373-lean.log
          if grep -E 'sorryAx|admitAx|error:' /tmp/phase373-lean.log; then exit 1; fi
      - name: Inspect theorem names and permitted axioms
        run: |
          cat >/tmp/phase373-audit.lean <<'LEAN'
          import TenthDiscriminant.Phase373ClockAuthoritySquare
          #check TenthDiscriminant.Phase373.historical_fast_source_rejected
          #check TenthDiscriminant.Phase373.meso_source_authorized
          #check TenthDiscriminant.Phase373.causal_order_reflect
          #check TenthDiscriminant.Phase373.constant_time_map_collapses_causality
          #check TenthDiscriminant.Phase373.no_source_meso_to_fast_bridge
          #check TenthDiscriminant.Phase373.evidence_square_causality
          #print axioms TenthDiscriminant.Phase373.causal_order_reflect
          #print axioms TenthDiscriminant.Phase373.no_source_meso_to_fast_bridge
          #print axioms TenthDiscriminant.Phase373.evidence_square_causality
          LEAN
          set -o pipefail
          lake env lean /tmp/phase373-audit.lean 2>&1 | tee /tmp/phase373-axioms.log
          if grep -E 'sorryAx|admitAx|error:' /tmp/phase373-axioms.log; then exit 1; fi
          echo 'VERIFIED_PHASE373_CLOCK_MODEL; authorization snapshot authenticity not proved'
