name: E20 Euclid count/log overhead at 300 (focused Lean)

on:
  push:
    branches: ['research/e20-euclid-count-log-300']
    paths:
      - 'lean/TenthDiscriminant/E20EuclidCountLog300.lean'
      - '.github/workflows/e20-euclid-count-log-300.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e20-euclid-count
  cancel-in-progress: true

jobs:
  e20-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile same-source count and log budget
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E20EuclidCountLog300 2>&1 | tee /tmp/e20.log
          if grep -q 'sorryAx' /tmp/e20.log; then exit 1; fi
      - name: Check exact theorem and axioms
        run: |
          cat >/tmp/e20-axioms.lean <<'LEAN'
          import TenthDiscriminant.E20EuclidCountLog300
          #check TenthDiscriminant.E20.euclid_count_log_over_R_300
          #print axioms TenthDiscriminant.E20.euclid_log_D_over_R_300
          #print axioms TenthDiscriminant.E20.euclid_count_log_over_R_300
          LEAN
          set -o pipefail
          lake env lean /tmp/e20-axioms.lean | tee /tmp/e20-axioms.log
          if grep -q 'sorryAx' /tmp/e20-axioms.log; then exit 1; fi
