name: Phase343 307 log-floor and conditional scalar certificate

on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase343Log307.lean'
      - 'lean/TenthDiscriminant/Phase343Scalar307.lean'
      - '.github/workflows/phase343-scalar307.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase343Log307.lean'
      - 'lean/TenthDiscriminant/Phase343Scalar307.lean'
      - '.github/workflows/phase343-scalar307.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase343-scalar307-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conditional-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact rational endpoint and counterexample controls
        working-directory: .
        run: python3 -m unittest discover -s research/phase341 -p 'test_*.py' -v
      - name: Build 307 logarithm and no-mixed scalar statements
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase343Log307 TenthDiscriminant.Phase343Scalar307 2>&1 | tee /tmp/phase343-build.log
          if grep -q 'sorryAx' /tmp/phase343-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Exact type and standard axiom audit
        run: |
          cat > /tmp/phase343-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase343Scalar307
          #check TenthDiscriminant.Phase343.log_floor_from_307_fourth_power
          #check TenthDiscriminant.Phase343.strong_scalar_separation_307_without_mixed
          #check TenthDiscriminant.Phase343.no_scalar_overlap_307_without_mixed
          #print axioms TenthDiscriminant.Phase343.log_floor_from_307_fourth_power
          #print axioms TenthDiscriminant.Phase343.strong_scalar_separation_307_without_mixed
          #print axioms TenthDiscriminant.Phase343.no_scalar_overlap_307_without_mixed
          LEAN
          set -o pipefail
          lake env lean /tmp/phase343-axioms.lean | tee /tmp/phase343-axioms.log
          if grep -q 'sorryAx' /tmp/phase343-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
