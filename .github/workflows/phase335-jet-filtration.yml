name: Phase335 conductor-sensitive original-jet filtrations
on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/Phase335JetFiltration.lean'
      - 'research/phase335/test_*.py'
      - '.github/workflows/phase335-jet-filtration.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase335JetFiltration.lean'
      - 'research/phase335/test_*.py'
      - '.github/workflows/phase335-jet-filtration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase335-jet-filtration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-jet-filtrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact source-jet filtration and sharpness controls
        working-directory: .
        run: python3 -m unittest discover -s research/phase335 -p 'test_*.py' -v
      - name: Build same-source odd and binary filtration theorems
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase335JetFiltration 2>&1 | tee /tmp/phase335-build.log
          if grep -q 'sorryAx' /tmp/phase335-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Check original-jet bridge theorem axioms
        run: |
          cat > /tmp/phase335-axioms.lean <<'LEAN'
          import TenthDiscriminant.Phase335JetFiltration
          #check TenthDiscriminant.Phase335.odd_jet_filtration_equivalence
          #check TenthDiscriminant.Phase335.maximal_jet_two_step_to_source
          #check TenthDiscriminant.Phase335.sourceHJet_zero_divisible_by_four
          #check TenthDiscriminant.Phase335.originalH_first_ordinary_jet_not_four
          #check TenthDiscriminant.Phase335.originalH_second_ordinary_jet_not_four
          #check TenthDiscriminant.Phase335.maximalH_omega_not_even
          #print axioms TenthDiscriminant.Phase335.odd_jet_filtration_equivalence
          #print axioms TenthDiscriminant.Phase335.maximal_jet_two_step_to_source
          #print axioms TenthDiscriminant.Phase335.sourceHJet_zero_divisible_by_four
          #print axioms TenthDiscriminant.Phase335.originalH_first_ordinary_jet_not_four
          #print axioms TenthDiscriminant.Phase335.originalH_second_ordinary_jet_not_four
          #print axioms TenthDiscriminant.Phase335.maximalH_omega_not_even
          LEAN
          set -o pipefail
          lake env lean /tmp/phase335-axioms.lean | tee /tmp/phase335-axioms.log
          if grep -q 'sorryAx' /tmp/phase335-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
