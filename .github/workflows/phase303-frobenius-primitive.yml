name: Phase303-E genuine maximal-order Frobenius primitive Gram
on:
  push:
    branches: ['research/phase303-*']
  pull_request:
    paths:
      - 'research/phase303/**'
      - '.github/workflows/phase303-frobenius-primitive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-source-frobenius:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin modular arithmetic dependencies
        run: |
          python3 -m venv /tmp/phase303e
          /tmp/phase303e/bin/python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Compile source
        run: /tmp/phase303e/bin/python -m py_compile research/phase303/frobenius_primitive_gram.py
      - name: Exact source Frobenius row divisions and full primitive trace Gram
        run: /tmp/phase303e/bin/python -u research/phase303/frobenius_primitive_gram.py
