name: Phase306 targeted Phase304 Lean source-jet smoke
on:
  push:
    branches: ['research/phase306-*']
    paths:
      - 'lean/TenthDiscriminant/Phase304SourceJet.lean'
      - '.github/workflows/phase306-lean-smoke.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/Phase304SourceJet.lean'
      - '.github/workflows/phase306-lean-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan if absent
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build repaired narrow source-jet module only
        run: |
          lake update
          lake exe cache get
          lake build TenthDiscriminant.Phase304SourceJet
