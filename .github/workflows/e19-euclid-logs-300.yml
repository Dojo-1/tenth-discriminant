name: E19 source logarithm guards at 300 (focused Lean)

on:
  push:
    branches: ['research/e19-euclid-log-guards']
    paths:
      - 'lean/TenthDiscriminant/E19EuclidLogGuards300.lean'
      - '.github/workflows/e19-euclid-logs-300.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e19-euclid-logs
  cancel-in-progress: true

jobs:
  e19-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact source logarithm guards
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E19EuclidLogGuards300 2>&1 | tee /tmp/e19.log
          if grep -q 'sorryAx' /tmp/e19.log; then exit 1; fi
      - name: Exact theorem and axioms
        run: |
          cat >/tmp/e19-axioms.lean <<'LEAN'
          import TenthDiscriminant.E19EuclidLogGuards300
          #check TenthDiscriminant.E19.euclid_log_radius_upper_300
          #check TenthDiscriminant.E19.euclid_log_R_over_radius_upper_300
          #print axioms TenthDiscriminant.E19.euclid_log_radius_upper_300
          #print axioms TenthDiscriminant.E19.euclid_log_R_over_radius_upper_300
          LEAN
          set -o pipefail
          lake env lean /tmp/e19-axioms.lean | tee /tmp/e19-axioms.log
          if grep -q 'sorryAx' /tmp/e19-axioms.log; then exit 1; fi
