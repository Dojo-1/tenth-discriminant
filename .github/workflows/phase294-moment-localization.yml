name: Phase294-B original jet moment localization
on:
  push:
    branches: ['research/phase294-*']
  pull_request:
    paths:
      - 'research/phase294/**'
      - '.github/workflows/phase294-moment-localization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-original-jet-remainder:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile exact source
        run: |
          python3 -m py_compile research/phase294/support_debt_tower.py
          python3 -m py_compile research/phase294/original_moment_localization.py
      - name: Exact original mixed-moment and unmatched sample original jet oracle
        run: python3 -u research/phase294/original_moment_localization.py
