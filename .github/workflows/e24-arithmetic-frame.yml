name: E24 arithmetic worldlet transport (focused Lean)

on:
  push:
    branches: ['research/e24-arithmetic-worldlet-transport']
    paths:
      - 'lean/TenthDiscriminant/E24ArithmeticFrame.lean'
      - '.github/workflows/e24-arithmetic-frame.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e24-arithmetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e24-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact source arithmetic frame transport
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E24ArithmeticFrame 2>&1 | tee /tmp/e24.log
          if grep -q 'sorryAx' /tmp/e24.log; then exit 1; fi
      - name: Check theorem and standard axiom dependencies
        run: |
          cat >/tmp/e24-audit.lean <<'LEAN'
          import TenthDiscriminant.E24ArithmeticFrame
          #check TenthDiscriminant.E24.squareOrderEmbed_originalGram
          #check TenthDiscriminant.E24.squareOrderEmbed_originalGram_det
          #check TenthDiscriminant.E24.sourceBasis_det_square_index
          #print axioms TenthDiscriminant.E24.squareOrderEmbed_ordinary_jet
          #print axioms TenthDiscriminant.E24.squareOrderEmbed_originalGram
          #print axioms TenthDiscriminant.E24.sourceBasis_det_square_index
          #print axioms TenthDiscriminant.E24.rationalDown_loses_integral_witness
          LEAN
          set -o pipefail
          lake env lean /tmp/e24-audit.lean | tee /tmp/e24-axioms.log
          if grep -q 'sorryAx' /tmp/e24-axioms.log; then exit 1; fi
