name: Phase372 attempt-identity Lean anti-replay theorem
on:
  push:
    branches: ['research/phase372-attempt-identity-and-anti-recirculation']
    paths:
      - 'lean/TenthDiscriminant/Phase372ExecutionAttempts.lean'
      - '.github/workflows/phase372-attempt-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase372-attempt-lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact Phase372 execution and credit state machine
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase372ExecutionAttempts 2>&1 | tee /tmp/phase372-lean.log
          if grep -E 'sorryAx|admitAx|error:' /tmp/phase372-lean.log; then exit 1; fi
      - name: Verify theorem names and transitive axioms
        run: |
          cat > /tmp/phase372-audit.lean <<'LEAN'
          import TenthDiscriminant.Phase372ExecutionAttempts
          #check TenthDiscriminant.Phase372.no_credit_without_issue
          #check TenthDiscriminant.Phase372.no_credit_for_preissuance_execution
          #check TenthDiscriminant.Phase372.no_credit_for_reused_execution
          #check TenthDiscriminant.Phase372.no_credit_for_reused_job
          #check TenthDiscriminant.Phase372.wellFormed_reachable
          #check TenthDiscriminant.Phase372.same_run_distinct_execution
          #print axioms TenthDiscriminant.Phase372.wellFormed_reachable
          #print axioms TenthDiscriminant.Phase372.same_run_distinct_execution
          LEAN
          set -o pipefail
          lake env lean /tmp/phase372-audit.lean 2>&1 | tee /tmp/phase372-axioms.log
          if grep -E 'sorryAx|admitAx|error:' /tmp/phase372-axioms.log; then exit 1; fi
          echo 'VERIFIED_PHASE372_LEAN_MODEL; external GitHub and signer semantics NOT proved'
