name: Phase331 Same-Gram Joint Binary Bridge
on:
  push:
    branches: ['research/phase309-original-source-picard-minors']
    paths:
      - 'lean/TenthDiscriminant/BinaryNullBidirectionalRowAction.lean'
      - 'lean/TenthDiscriminant/BinaryNullBidirectionalTraceGram.lean'
      - 'lean/TenthDiscriminant/Phase331JointBinaryOddProduct315.lean'
      - 'lean/TenthDiscriminant/Phase331JointBinaryOddLog315.lean'
      - 'lean/TenthDiscriminant/Phase331BinaryNormalizedGain315.lean'
      - 'lean/TenthDiscriminant/Phase331TenPrimeFloor315.lean'
      - 'lean/TenthDiscriminant/Phase331OddTenNormalizedGain315.lean'
      - 'lean/TenthDiscriminant/Phase331OddMassSplit315.lean'
      - 'lean/TenthDiscriminant/Phase331SameGramLower315.lean'
      - 'lean/TenthDiscriminant/Phase331ScalarOverlap315.lean'
      - 'lean/TenthDiscriminant/Phase331ActualField315.lean'
      - 'research/phase331/**'
      - 'lean/TenthDiscriminant/BinaryNullHorizontalRowAction.lean'
      - '.github/workflows/phase331-joint-binary.yml'
  pull_request:
    paths:
      - 'lean/TenthDiscriminant/BinaryNullBidirectionalRowAction.lean'
      - 'lean/TenthDiscriminant/BinaryNullBidirectionalTraceGram.lean'
      - 'lean/TenthDiscriminant/Phase331JointBinaryOddProduct315.lean'
      - 'lean/TenthDiscriminant/Phase331JointBinaryOddLog315.lean'
      - 'lean/TenthDiscriminant/Phase331BinaryNormalizedGain315.lean'
      - 'lean/TenthDiscriminant/Phase331TenPrimeFloor315.lean'
      - 'lean/TenthDiscriminant/Phase331OddTenNormalizedGain315.lean'
      - 'lean/TenthDiscriminant/Phase331OddMassSplit315.lean'
      - 'lean/TenthDiscriminant/Phase331SameGramLower315.lean'
      - 'lean/TenthDiscriminant/Phase331ScalarOverlap315.lean'
      - 'lean/TenthDiscriminant/Phase331ActualField315.lean'
      - 'research/phase331/**'
      - '.github/workflows/phase331-joint-binary.yml'
  workflow_dispatch:
concurrency:
  group: phase331-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-jet-composed:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Independent integer-floor and rational scalar negative controls
        working-directory: .
        run: python3 -m unittest discover -s research/phase331 -p 'test_*.py' -v
      - name: Verify source-original paired binary polynomial actions
        run: |
          lake update
          lake exe cache get
          lean --version
          set -o pipefail
          lake build TenthDiscriminant.BinaryNullBidirectionalRowAction TenthDiscriminant.BinaryNullBidirectionalTraceGram TenthDiscriminant.Phase331JointBinaryOddProduct315 TenthDiscriminant.Phase331JointBinaryOddLog315 TenthDiscriminant.Phase331BinaryNormalizedGain315 TenthDiscriminant.Phase331TenPrimeFloor315 TenthDiscriminant.Phase331OddTenNormalizedGain315 TenthDiscriminant.Phase331OddMassSplit315 TenthDiscriminant.Phase331SameGramLower315 TenthDiscriminant.Phase331ScalarOverlap315 TenthDiscriminant.Phase331ActualField315 2>&1 | tee /tmp/phase331-binary.log
          if grep -q 'sorryAx' /tmp/phase331-binary.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Check exact final field theorem and permitted axioms
        run: |
          printf '%s\n' 'import TenthDiscriminant.Phase331ActualField315' \
            '#check TenthDiscriminant.Threshold315.totallyComplex_degree_two_classNumber_one_discriminant_bound_315' \
            '#print axioms TenthDiscriminant.Threshold315.totallyComplex_degree_two_classNumber_one_discriminant_bound_315' \
            > /tmp/phase331-field-check.lean
          lake env lean /tmp/phase331-field-check.lean
