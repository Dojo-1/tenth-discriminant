name: Phase170 thin-ellipse count at fourth-root 377
on:
  push:
    branches: ['formalization/phase170-thin-count-377']
    paths:
      - lean/TenthDiscriminant/ThinEllipseCount377.lean
      - lean/TenthDiscriminant.lean
      - .github/workflows/phase170-thin-count377.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/ThinEllipseCount377.lean
      - lean/TenthDiscriminant.lean
      - .github/workflows/phase170-thin-count377.yml
permissions:
  contents: read
jobs:
  thin-count-377:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify original thin-ellipse interpolation at fourth-root 377
        run: |
          git rev-parse HEAD
          lake update
          lake exe cache get
          lake build TenthDiscriminant.ThinEllipseCount377
