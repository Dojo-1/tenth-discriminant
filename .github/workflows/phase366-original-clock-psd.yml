name: Phase366 original observation-clock PSD exact Lean
on:
  push:
    branches: ['research/phase366-original-observation-clock-psd']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase366-clock-psd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clock-psd-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact Phase366 Lean compilation
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.Phase366ObservationClockPSD 2>&1 | tee /tmp/phase366.log
          if grep -E 'sorryAx|admitAx|error:' /tmp/phase366.log; then exit 1; fi
      - name: Audit theorem identities and transitive axioms
        run: |
          cat >/tmp/phase366-audit.lean <<'LEAN'
          import TenthDiscriminant.Phase366ObservationClockPSD
          #check TenthDiscriminant.Phase366.integerTraceGramEntry_clock_succ
          #check TenthDiscriminant.Phase366.integerTraceGramMatrix_clock_succ
          #check TenthDiscriminant.Phase366.traceGramMatrix_clock_increment_posSemidef
          #check TenthDiscriminant.Phase366.integerTraceGramMatrix_clock_increment_posSemidef
          #check TenthDiscriminant.Phase366.integerRectangularTraceGram_clock_increment_posSemidef
          #print axioms TenthDiscriminant.Phase366.integerRectangularTraceGram_clock_increment_posSemidef
          LEAN
          set -o pipefail
          lake env lean /tmp/phase366-audit.lean 2>&1 | tee /tmp/phase366-audit.log
          if grep -E 'sorryAx|admitAx|error:' /tmp/phase366-audit.log; then exit 1; fi
