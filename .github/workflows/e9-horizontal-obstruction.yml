name: E9 horizontal polynomial (focused Lean)

on:
  push:
    branches: ['research/e9-horizontal-counterworld']
    paths:
      - 'lean/TenthDiscriminant/E9HorizontalObstruction.lean'
      - '.github/workflows/e9-horizontal-obstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e9-horizontal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e9-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build IVT root and exact endpoint certificates
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E9HorizontalObstruction 2>&1 | tee /tmp/e9-build.log
          if grep -q 'sorryAx' /tmp/e9-build.log; then echo 'Unproved sorryAx'; exit 1; fi
      - name: Check exact theorem types and axioms
        run: |
          cat > /tmp/e9-axioms.lean <<'LEAN'
          import TenthDiscriminant.E9HorizontalObstruction
          #check TenthDiscriminant.E9.horizontalObstruction_has_root
          #check TenthDiscriminant.E9.determinantFactor_endpoint_values
          #print axioms TenthDiscriminant.E9.horizontalObstruction_has_root
          #print axioms TenthDiscriminant.E9.determinantFactor_endpoint_values
          LEAN
          set -o pipefail
          lake env lean /tmp/e9-axioms.lean | tee /tmp/e9-axioms.log
          if grep -q 'sorryAx' /tmp/e9-axioms.log; then echo 'Unproved sorryAx'; exit 1; fi
