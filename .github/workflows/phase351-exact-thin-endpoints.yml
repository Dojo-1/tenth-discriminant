name: Phase351 exact original thin ellipse endpoint oracle

on:
  push:
    branches: ['research/phase351-thin-source-endpoint-audit']
    paths:
      - 'research/oracles/phase351_exact_original_ellipse.py'
      - '.github/workflows/phase351-exact-thin-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Count original integer ellipse and source scalar margins at frozen fourth powers
        run: python3 research/oracles/phase351_exact_original_ellipse.py
