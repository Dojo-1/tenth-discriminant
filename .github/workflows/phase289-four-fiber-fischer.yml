name: Phase289 original-source graded four-fiber Fischer
on:
  push:
    branches: ['research/phase289-*']
  pull_request:
    paths:
      - 'research/phase289/**'
      - '.github/workflows/phase289-four-fiber-fischer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-four-fiber:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile exact integer source
        run: python3 -m py_compile research/phase289/four_fiber_fischer.py
      - name: Frozen original D283 and D403 four-fiber Fischer upper and gauge
        run: python3 -u research/phase289/four_fiber_fischer.py
