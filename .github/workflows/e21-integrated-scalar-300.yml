name: E21 integrated scalar and odd quadratic exclusion (focused Lean)

on:
  push:
    branches: ['research/e21-integrated-scalar-300']
    paths:
      - 'lean/TenthDiscriminant/E18EuclidGuards300.lean'
      - 'lean/TenthDiscriminant/E19EuclidLogGuards300.lean'
      - 'lean/TenthDiscriminant/E20EuclidCountLog300.lean'
      - 'lean/TenthDiscriminant/E17ScalarLower300.lean'
      - 'lean/TenthDiscriminant/E17UpperAlgebra.lean'
      - 'lean/TenthDiscriminant/E21IntegratedScalar300.lean'
      - '.github/workflows/e21-integrated-scalar-300.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e21-integrated-scalar
  cancel-in-progress: true

jobs:
  e21-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile full same-source original Gram scalar bridge
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E21IntegratedScalar300 2>&1 | tee /tmp/e21.log
          if grep -q 'sorryAx' /tmp/e21.log; then exit 1; fi
      - name: Exact theorem and standard axiom gate
        run: |
          cat >/tmp/e21-axioms.lean <<'LEAN'
          import TenthDiscriminant.E21IntegratedScalar300
          #check TenthDiscriminant.E21.euclid_uniform_scalar_separation_300
          #check TenthDiscriminant.E21.odd_classNumber_ne_one_300
          #print axioms TenthDiscriminant.E21.euclid_uniform_scalar_separation_300
          #print axioms TenthDiscriminant.E21.odd_classNumber_ne_one_300
          LEAN
          set -o pipefail
          lake env lean /tmp/e21-axioms.lean | tee /tmp/e21-axioms.log
          if grep -q 'sorryAx' /tmp/e21-axioms.log; then exit 1; fi
