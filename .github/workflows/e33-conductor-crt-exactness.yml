name: E33 exact conductor CRT witness sequence (focused Lean)

on:
  push:
    branches: ['research/e33-exact-conductor-crt-sequence']
    paths:
      - 'lean/TenthDiscriminant/E33ConductorCRTExactness.lean'
      - 'lean/TenthDiscriminant.lean'
      - '.github/workflows/e33-conductor-crt-exactness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e33-conductor-crt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e29-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile graded reconstruction gate
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E33ConductorCRTExactness 2>&1 | tee /tmp/e33.log
          if grep -q 'sorryAx' /tmp/e33.log; then exit 1; fi
      - name: Axiom audit exact theorem declarations
        run: |
          cat >/tmp/e33-audit.lean <<'LEAN'
          import TenthDiscriminant.E33ConductorCRTExactness
          #check TenthDiscriminant.E33.conductor_prime_exact_sequence
          #print axioms TenthDiscriminant.E33.epsilonInclude_injective
          #print axioms TenthDiscriminant.E33.conductor_kernel_iff_epsilon_image
          #print axioms TenthDiscriminant.E33.prime_gap_kernel_iff_conductor_image
          #print axioms TenthDiscriminant.E33.prime_gap_surjective
          #print axioms TenthDiscriminant.E33.conductor_prime_exact_sequence
          #print axioms TenthDiscriminant.E33.conductor_preserves_source_multiplication
          LEAN
          set -o pipefail
          lake env lean /tmp/e33-audit.lean | tee /tmp/e33-axioms.log
          if grep -q 'sorryAx' /tmp/e33-axioms.log; then exit 1; fi
