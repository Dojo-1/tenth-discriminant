name: Phase316 norm-preserving global wild-gauge obstruction
on:
  push:
    branches: ['research/phase316-*']
    paths:
      - 'research/phase316/**'
      - '.github/workflows/phase316-wild-gauge.yml'
  pull_request:
    paths:
      - 'research/phase316/**'
      - '.github/workflows/phase316-wild-gauge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-ideal-valuation-and-original-gram:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin numerical arithmetic
        run: |
          python3 -m venv /tmp/phase316
          /tmp/phase316/bin/python -m pip install --disable-pip-version-check numpy==2.2.6 sympy==1.14.0
      - name: Validate Phase316 evidence audit and three preregistrations
        run: |
          python3 -m json.tool research/phase316/AUDIT_MANIFEST.json >/dev/null
          python3 -c 'import json; x=json.load(open("research/phase316/AUDIT_MANIFEST.json")); assert x["no_main_merge"]; assert len(x["prereg"])==3; assert len(x["propositions"])>=7; assert x["measurements"]["first_original_global_realization_obstruction"]["norm"]==164; print("Phase316 evidence audit PASS")'
      - name: Static Python syntax
        run: /tmp/phase316/bin/python -m py_compile research/phase316/*.py
      - name: Global trace-zero conductor125 gauge twist and original Gram mod25
        run: /tmp/phase316/bin/python -u research/phase316/wild_gauge.py
      - name: Classical small norm square ideal shells under h1 versus D187 nonh1
        run: /tmp/phase316/bin/python -u research/phase316/small_norm_rigidity.py
      - name: First global ray realization obstruction at exact original norm164
        run: /tmp/phase316/bin/python -u research/phase316/realization_obstruction.py
      - name: Adversarial ideal character, norm125, conj, ray250, source tests
        run: /tmp/phase316/bin/python -m unittest discover -s research/phase316 -p 'test_*.py' -v
      - name: Preserve original Phase315 arithmetic and second wild digit
        run: /tmp/phase316/bin/python -u research/phase315/conductor250_original_mod25.py
