name: Phase317 exact norm fibre and two original Gram Smith digits
on:
  push:
    branches: ['research/phase317-*']
    paths:
      - 'research/phase317/**'
      - '.github/workflows/phase317-fibre-smith.yml'
  pull_request:
    paths:
      - 'research/phase317/**'
      - '.github/workflows/phase317-fibre-smith.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-fibre-and-smith-slices:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin exact numerical environment
        run: |
          python3 -m venv /tmp/phase317
          /tmp/phase317/bin/python -m pip install --disable-pip-version-check numpy==2.2.6 sympy==1.14.0
      - name: Verify Phase317 preregistrations and evidence boundary audit
        run: |
          python3 -m json.tool research/phase317/AUDIT_MANIFEST.json >/dev/null
          python3 -c 'import json; a=json.load(open("research/phase317/AUDIT_MANIFEST.json")); assert a["main_unchanged"]; assert len(a["prereg"])==3; assert len(a["claims"])>=9; assert a["measurements"]["native_original_D163"]["Smith_first_two_digit_exponents"]==[23,7,10]; print("Phase317 evidence audit PASS")'
      - name: Static syntax
        run: /tmp/phase317/bin/python -m py_compile research/phase317/*.py
      - name: Exact norm-D+1 four/six generator field controls
        run: /tmp/phase317/bin/python -u research/phase317/norm_first_fibre.py
      - name: Two Smith digits of actual native Gram and all five synthetic gauges
        run: /tmp/phase317/bin/python -u research/phase317/two_digit_smith.py
      - name: Radical first lift form and exact tangent versus normal gauge controls
        run: /tmp/phase317/bin/python -u research/phase317/radical_tangent.py
      - name: Hostile source, fibre, pivot and GL40 invariance unit tests
        run: /tmp/phase317/bin/python -m unittest discover -s research/phase317 -p 'test_*.py' -v
      - name: Retain actual Phase316 exact native norm164 generator obstruction
        run: /tmp/phase317/bin/python -u research/phase316/realization_obstruction.py
