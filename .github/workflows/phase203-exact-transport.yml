name: Phase203 exact arithmetic and kernel-radical transport
on:
  pull_request:
    paths:
      - "research/phase203/**"
      - "lean/TenthDiscriminant/PlacewiseExactSequence.lean"
      - "lean/TenthDiscriminant.lean"
      - ".github/workflows/phase203-exact-transport.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-residue-isometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: All 25 residue-orbit congruences, two independent arithmetic oracles
        run: |
          python3 research/phase203/check_intertwiner_f7.py
  formal-kernel-radical:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          lake update
          lake exe cache get
          lean --version
      - name: Build exact Phase203 source and its imports
        run: lake build TenthDiscriminant.PlacewiseExactSequence
      - name: Check exported theorem axioms, forbid sorryAx
        run: |
          lake env lean TenthDiscriminant/PlacewiseExactSequence.lean 2>&1 | tee /tmp/phase203_axioms.txt
          if grep -q 'sorryAx' /tmp/phase203_axioms.txt; then
            echo "Phase203 unproved axiom found" >&2
            exit 1
          fi
