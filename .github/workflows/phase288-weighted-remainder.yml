name: Phase288-B weighted maximal-order remainder into original Gram
on:
  push:
    branches: ['research/phase288-*']
  pull_request:
    paths:
      - 'research/phase288/**'
      - '.github/workflows/phase288-weighted-remainder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-weighted-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax
        run: python3 -m py_compile research/phase288/weighted_full_order_remainder.py
      - name: Exact weighted two-coset angular and original-source integral anchor
        run: python3 -u research/phase288/weighted_full_order_remainder.py
