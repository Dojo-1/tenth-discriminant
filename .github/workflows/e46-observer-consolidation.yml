name: E46 original observer family combined certificate
on:
  push:
    branches: ['research/e46-consolidate-moment-crt-saturation']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e46-observers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observer-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original E42 E43 E44 E45
        run: |
          lake update
          lake exe cache get
          set -o pipefail
          lake build TenthDiscriminant.E42OriginalGramMomentSignature TenthDiscriminant.E43IndependentConjugationObserver TenthDiscriminant.E44LabelledCRTObserverRefinement TenthDiscriminant.E45FullEllipseOrientationNull 2>&1 | tee /tmp/e46-build.log
          if grep -q 'sorryAx' /tmp/e46-build.log; then exit 1; fi
      - name: Check exact original theorem closures
        run: |
          cat >/tmp/e46-audit.lean <<'LEAN'
          import TenthDiscriminant.E42OriginalGramMomentSignature
          import TenthDiscriminant.E43IndependentConjugationObserver
          import TenthDiscriminant.E44LabelledCRTObserverRefinement
          import TenthDiscriminant.E45FullEllipseOrientationNull
          #print axioms TenthDiscriminant.E42.original_gram_equal_iff_moments
          #print axioms TenthDiscriminant.E43.original_gram_invariant_under_injective_pointwise_conjugations
          #print axioms TenthDiscriminant.E45.ellipse_injective_partial_conjugation_no_new_source
          #print axioms TenthDiscriminant.E45.gaussian_full_ellipse_total_prime_gap_zero
          LEAN
          set -o pipefail
          lake env lean /tmp/e46-audit.lean 2>&1 | tee /tmp/e46-axioms.log
          if grep -q 'sorryAx' /tmp/e46-axioms.log; then exit 1; fi
