name: Phase195 exact original-source field discriminant 328 candidate
on:
  push:
    branches: ['research/phase195-actual-field328-candidate']
    paths:
      - lean/TenthDiscriminant/SameGramLower328.lean
      - lean/TenthDiscriminant/ActualField328.lean
      - research/thin_integrated/PHASE195_ACTUAL_FIELD328_CANDIDATE.md
      - .github/workflows/phase195-actual-field328.yml
  pull_request:
    paths:
      - lean/TenthDiscriminant/SameGramLower328.lean
      - lean/TenthDiscriminant/ActualField328.lean
      - research/thin_integrated/PHASE195_ACTUAL_FIELD328_CANDIDATE.md
      - .github/workflows/phase195-actual-field328.yml
permissions:
  contents: read
jobs:
  actual-field-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact same-original-Gram and actual-field theorem source gate
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from fractions import Fraction as F
          lower=Path('lean/TenthDiscriminant/SameGramLower328.lean').read_text()
          upper=Path('lean/TenthDiscriminant/ThinUpper328.lean').read_text()
          source=Path('lean/TenthDiscriminant/ActualField328.lean').read_text()
          geom=Path('lean/TenthDiscriminant/SourcePositivity328.lean').read_text()
          oddbin=Path('lean/TenthDiscriminant/SourceOddBinary328.lean').read_text()
          assert 'theorem thin_original_gram_pos_328' in geom
          assert 'theorem original_source_odd_plus_binary_normalized_lower_of_pos_328' in oddbin
          assert 'theorem thin_original_odd_plus_binary_normalized_lower_328' in lower
          assert 'FirstCertificate.Tuned.thin_original_gram_pos_328' in lower
          assert 'original_source_odd_plus_binary_normalized_lower_of_pos_328' in lower
          assert 'ellipsePairs D (FirstCertificate.Tuned.thinRadius D)' in lower
          assert 'ellipsePairs D (Tuned.thinRadius D)' in upper
          assert 'integerRectangularTraceGram' in lower and 'integerRectangularTraceGram' in upper
          assert 'Tuned.thin_card_le_old_padded_majorant_328' in upper
          assert 'theorem thin_production_normalized_upper_328' in upper
          assert 'TenthDiscriminant.no_abstract_scalar_overlap_328' in source
          assert 'TenthDiscriminant.thin_original_odd_plus_binary_normalized_lower_328' in source
          assert 'ThinUpper328.thin_production_normalized_upper_328' in source
          assert 'theorem totallyComplex_degree_two_classNumber_one_discriminant_bound_328' in source
          assert 'NumberField.discr_eq_discr_of_algEquiv K e.symm' in source
          assert 'even_classNumber_ne_one' in source
          assert '(328 : Nat)^4 = 11574317056' in source
          for s in (lower,upper,source):
              for bad in ('331', 'sorry', 'admit', 'axiom ', 'thin_production_normalized_upper_331'):
                  assert bad not in s, bad
          gap=(F(999997,1000000)-F(4,5))*F(23172,1000)-F(57321,10000)+F(1849,2000)+F(6931,40000)
          assert gap==F(1371,250000000)>0
          print('PHASE195_ONE_ORIGINAL_GRAM_AND_FIELD_SOURCE_PASS',flush=True)
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source matched 328 actual-field theorem
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.ActualField328
      - name: Check exported field theorem and permitted axioms
        run: |
          printf '%s\n' 'import TenthDiscriminant.ActualField328' '#check TenthDiscriminant.Threshold328.totallyComplex_degree_two_classNumber_one_discriminant_bound_328' '#print axioms TenthDiscriminant.Threshold328.totallyComplex_degree_two_classNumber_one_discriminant_bound_328' > /tmp/phase195_axioms.lean
          lake env lean /tmp/phase195_axioms.lean
  human-markup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check mathematical Markdown
        run: python3 scripts/check_human_math.py research/thin_integrated/PHASE195_ACTUAL_FIELD328_CANDIDATE.md
