name: Phase196 original-source 327 field theorem candidate
on:
  push:
    branches: ['research/phase196-sharp-log327']
    paths:
      - lean/TenthDiscriminant/Phase196Scalar327.lean
      - lean/TenthDiscriminant/SourceGeometry327.lean
      - lean/TenthDiscriminant/SourcePositivity327.lean
      - lean/TenthDiscriminant/RecoveryGainFloorRatio.lean
      - lean/TenthDiscriminant/Lower327.lean
      - lean/TenthDiscriminant/SourceOddBinary327.lean
      - lean/TenthDiscriminant/SameGramLower327.lean
      - lean/TenthDiscriminant/UpperScalars327.lean
      - lean/TenthDiscriminant/ThinUpper327.lean
      - lean/TenthDiscriminant/ScalarOverlap327.lean
      - lean/TenthDiscriminant/ActualField327.lean
      - .github/workflows/phase196-field327.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-field-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Adversarial original-source and arithmetic-budget gate
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from fractions import Fraction as F
          src=Path('lean/TenthDiscriminant')
          lower=(src/'SameGramLower327.lean').read_text()
          upper=(src/'ThinUpper327.lean').read_text()
          actual=(src/'ActualField327.lean').read_text()
          scalars=(src/'Phase196Scalar327.lean').read_text()
          raw=(src/'Lower327.lean').read_text()
          geometry=(src/'SourcePositivity327.lean').read_text()
          upper_scalars=(src/'UpperScalars327.lean').read_text()
          assert 327**4==11433811041
          assert (F(999997,1000000)-F(4,5))*F(231596,10000)-F(57305,10000)+F(1851,2000)+F(6931,40000)==F(313803,2500000000)>0
          assert 'strong_raw_normalized_add_gain_floor_ratio_le_recovered' in raw
          assert 'theorem thin_original_gram_pos_327' in geometry
          assert 'integerRectangularTraceGram' in lower and 'integerRectangularTraceGram' in upper
          assert 'ellipsePairs D (FirstCertificate.Tuned.thinRadius D)' in lower
          assert 'ellipsePairs D (Tuned.thinRadius D)' in upper
          assert 'Tuned.thin_card_le_old_padded_majorant_327' in upper
          assert 'Tuned.normalized_upper_327' in upper
          assert 'log_radius_upper_327_sharp' in upper_scalars
          assert '(4/5 : Real)*Real.log D-814/1000' in upper_scalars
          assert 'theorem totallyComplex_degree_two_classNumber_one_discriminant_bound_327' in actual
          assert 'TenthDiscriminant.no_abstract_scalar_overlap_327' in actual
          assert 'NumberField.discr_eq_discr_of_algEquiv K e.symm' in actual
          assert 'even_classNumber_ne_one' in actual
          assert 'checkPositiveLogBounds 5 327 8' in scalars
          gsource=(src/'SourceGeometry327.lean').read_text()
          assert 'theorem rho_upper_327' not in gsource
          assert scalars.count('theorem rho_upper_327')==1
          assert 'theorem smaller_327_log_floor_rejected' in scalars
          for source in (lower,upper,actual,raw):
              for forbidden in ('331', '328', 'sorry', 'admit', 'axiom '):
                  assert forbidden not in source, forbidden
          print('PHASE196_327_ORIGINAL_GRAM_AND_RATIONAL_SOURCE_PASS')
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            lean/.lake/packages
          key: lean-4.19.0-mathlib-c44e0c8-linux-v1
      - name: Install pinned elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            mkdir -p /tmp/elan-install
            tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
            /tmp/elan-install/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original matched 327 field theorem on this head
        run: |
          lake update
          lake exe cache get
          git rev-parse HEAD
          lake build TenthDiscriminant.ActualField327
      - name: Check exported field theorem and transitive axioms
        run: |
          printf '%s\n' 'import TenthDiscriminant.ActualField327' \
            '#check TenthDiscriminant.Threshold327.totallyComplex_degree_two_classNumber_one_discriminant_bound_327' \
            '#print axioms TenthDiscriminant.Threshold327.totallyComplex_degree_two_classNumber_one_discriminant_bound_327' \
            > /tmp/phase196_field_axioms.lean
          lake env lean /tmp/phase196_field_axioms.lean
