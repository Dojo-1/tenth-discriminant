name: Phase295 full-original W-equivariant jet transport obstruction
on:
  push:
    branches: ['research/phase295-*']
  pull_request:
    paths:
      - 'research/phase295/**'
      - '.github/workflows/phase295-w-jet-obstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-observation-W-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile original fixed-W module source
        run: python3 -m py_compile research/phase295/w_equivariant_jet_obstruction.py
      - name: Exact original observation module and hostile p-adic jet matrix toys
        run: python3 -u research/phase295/w_equivariant_jet_obstruction.py
